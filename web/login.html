<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#080b10" />
<meta name="robots" content="noindex" />
<title>登录 · 语镜 LinguaLens</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #080b10;
    --card: #0e141c;
    --line: rgba(148, 163, 184, .18);
    --ink: #e8eef7;
    --soft: #b8c4d4;
    --muted: #7f8da1;
    --jade: #4de2c5;
    --jade-dark: #a7f3e4;
    --jade-wash: rgba(77, 226, 197, .08);
    --danger: #f0a38d;
    --sans: "Segoe UI Variable", "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --mono: "Cascadia Code", Consolas, "SFMono-Regular", monospace;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 28px 18px calc(28px + env(safe-area-inset-bottom));
    background:
      radial-gradient(900px 520px at 8% -10%, rgba(77, 226, 197, .10), transparent 60%),
      radial-gradient(760px 520px at 100% 0%, rgba(96, 165, 250, .08), transparent 58%),
      var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.65;
  }
  .wrap { width: 100%; max-width: 420px; }
  .brand { display: flex; align-items: center; gap: 11px; margin: 0 0 26px; }
  .mark {
    width: 36px; height: 36px; border-radius: 10px;
    display: grid; place-items: center;
    background: linear-gradient(135deg, var(--jade), #67e8f9 70%, #60a5fa);
    color: #03120e; font-weight: 900; font-size: 18px;
    box-shadow: 0 8px 22px rgba(77, 226, 197, .18);
  }
  .brand b { font-size: 18px; letter-spacing: .05em; }
  .brand small { display: block; margin-top: 1px; color: var(--muted); font-family: var(--mono); font-size: 8px; letter-spacing: .22em; text-transform: uppercase; }
  h1 { margin: 0 0 6px; font-size: clamp(25px, 7vw, 30px); letter-spacing: -.02em; }
  h1 em { font-style: normal; color: var(--jade); }
  .sub { margin: 0 0 22px; color: var(--soft); font-size: 12.5px; line-height: 1.75; }
  .card {
    padding: 22px 20px 20px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--card);
    box-shadow: 0 24px 70px rgba(0, 0, 0, .45);
  }
  .field { margin-bottom: 14px; }
  .field label { display: block; margin-bottom: 6px; color: var(--muted); font-family: var(--mono); font-size: 9px; letter-spacing: .16em; text-transform: uppercase; }
  .field input {
    width: 100%;
    height: 46px;
    padding: 0 13px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: #0a0f16;
    color: var(--ink);
    font-size: 16px;
    outline: none;
    transition: border-color .18s, box-shadow .18s;
  }
  .field input:focus { border-color: var(--jade); box-shadow: 0 0 0 3px rgba(77, 226, 197, .12); }
  .field input::placeholder { color: #5c6b7d; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 4px 0 18px; }
  .remember { display: inline-flex; align-items: center; gap: 8px; color: var(--soft); font-size: 12px; cursor: pointer; user-select: none; }
  .remember input { width: 16px; height: 16px; accent-color: var(--jade); margin: 0; }
  .hint { color: var(--muted); font-size: 10.5px; }
  .btn {
    width: 100%;
    height: 48px;
    border: 0;
    border-radius: 10px;
    background: var(--jade);
    color: #03120e;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .02em;
    cursor: pointer;
    transition: filter .18s, transform .1s;
  }
  .btn:hover { filter: brightness(1.06); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .6; cursor: wait; }
  .error {
    display: none;
    margin: 0 0 14px;
    padding: 10px 12px;
    border: 1px solid rgba(240, 163, 141, .35);
    border-radius: 8px;
    background: rgba(240, 163, 141, .08);
    color: var(--danger);
    font-size: 12px;
    line-height: 1.6;
  }
  .error.on { display: block; }
  .foot { margin-top: 18px; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 10.5px; line-height: 1.7; }
  .foot .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--jade); flex: none; }
  @media (max-width: 420px) {
    body { padding: 20px 14px calc(20px + env(safe-area-inset-bottom)); }
    .card { padding: 19px 16px 17px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <span class="mark">语</span>
    <div><b>语镜 LinguaLens</b><small>Public Edition</small></div>
  </div>

  <h1>登录<em>语镜</em></h1>
  <p class="sub">这台设备第一次打开需要登录一次，之后 30 天内不用再输。</p>

  <form class="card" id="login-form" autocomplete="on">
    <div class="error" id="error" role="alert"></div>

    <div class="field">
      <label for="username">用户名</label>
      <input id="username" name="username" type="text" value="lingualens" autocomplete="username" autocapitalize="none" spellcheck="false" required />
    </div>

    <div class="field">
      <label for="password">密码</label>
      <input id="password" name="password" type="password" placeholder="输入访问密码" autocomplete="current-password" required autofocus />
    </div>

    <div class="row">
      <label class="remember"><input id="remember" type="checkbox" checked /> 记住这台设备</label>
      <span class="hint">30 天</span>
    </div>

    <button class="btn" id="submit" type="submit">进入语镜</button>
  </form>

  <div class="foot">
    <span class="dot"></span>
    <span>密码只用于这一个人部署 · 不会发送到任何第三方</span>
  </div>
</div>

<script>
  const form = document.getElementById('login-form');
  const errorBox = document.getElementById('error');
  const submit = document.getElementById('submit');

  const params = new URLSearchParams(location.search);
  const rawNext = params.get('next') || '/';
  const next = rawNext.startsWith('/') && !rawNext.startsWith('//') ? rawNext : '/';

  function showError(text) {
    errorBox.textContent = text;
    errorBox.classList.add('on');
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    errorBox.classList.remove('on');
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const remember = document.getElementById('remember').checked;
    if (!username || !password) {
      showError('用户名和密码都要填。');
      return;
    }
    submit.disabled = true;
    submit.textContent = '正在登录…';
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 25000);
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password, remember }),
        signal: controller.signal,
      });
      const data = await res.json().catch(() => null);
      if (!res.ok || !data || data.ok !== true) {
        throw new Error((data && data.error) || '登录失败，请重试');
      }
      // 给浏览器一点时间把 HttpOnly Cookie 落盘，再跳转
      setTimeout(() => location.replace(next), 250);
    } catch (err) {
      const message = err.name === 'AbortError' ? '连接超时，请稍后再试' : (err.message || '登录失败，请检查网络');
      showError(message);
      submit.disabled = false;
      submit.textContent = '进入语镜';
      document.getElementById('password').select();
    } finally {
      clearTimeout(timer);
    }
  });

  // 已经登录过时，服务端会直接跳走；这里只处理密码框聚焦。
  if (document.getElementById('username').value) {
    document.getElementById('password').focus();
  }
</script>
</body>
</html>
