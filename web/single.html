/* ==========================================================================
   语镜 LinguaLens — paper, ink, jade, vermilion.
   ========================================================================== */

:root {
  --paper: #f4efe4;
  --paper-deep: #ebe3d3;
  --paper-light: #fbf8f0;
  --card: #fdfaf3;
  --ink: #17211c;
  --ink-soft: #445149;
  --muted: #798077;
  --faint: #a6a99d;
  --line: #dad1c0;
  --line-strong: #c4b8a2;
  --jade: #146b58;
  --jade-dark: #0c4d3e;
  --jade-soft: #dce9e1;
  --jade-wash: #edf3ee;
  --coral: #d25b41;
  --coral-dark: #a8412d;
  --coral-soft: #f3dfd8;
  --gold: #ad843d;
  --gold-soft: #efe4cc;
  --white: #fffdf8;
  --shadow-sm: 0 1px 0 rgba(23, 33, 28, .05), 0 4px 14px rgba(52, 42, 25, .04);
  --shadow-md: 0 2px 0 rgba(23, 33, 28, .04), 0 18px 48px rgba(52, 42, 25, .08);
  --shadow-lg: 0 32px 90px rgba(37, 31, 20, .16);
  --radius: 14px;
  --radius-sm: 9px;
  --serif: "Iowan Old Style", "Palatino Linotype", "Noto Serif SC", "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", Georgia, serif;
  --sans: "Segoe UI", "Noto Sans SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, sans-serif;
  --mono: "Cascadia Code", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  --ease: cubic-bezier(.2, .7, .2, 1);
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  color: var(--ink);
  background:
    radial-gradient(1200px 600px at 8% -10%, rgba(255, 252, 243, .9), transparent 58%),
    radial-gradient(900px 700px at 100% 5%, rgba(20, 107, 88, .055), transparent 50%),
    var(--paper);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  opacity: .34;
  background-image:
    linear-gradient(rgba(86, 71, 48, .035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(86, 71, 48, .035) 1px, transparent 1px);
  background-size: 34px 34px;
  mask-image: linear-gradient(to bottom, black, transparent 82%);
}

::selection { background: rgba(20, 107, 88, .2); color: var(--jade-dark); }

a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
img, svg { display: block; max-width: 100%; }

.skip-link {
  position: fixed;
  left: 16px; top: -60px;
  z-index: 200;
  padding: 10px 16px;
  background: var(--ink); color: var(--paper-light);
  border-radius: 8px;
  transition: top .2s;
}
.skip-link:focus { top: 12px; }

:focus-visible {
  outline: 2px solid var(--coral);
  outline-offset: 3px;
}

/* ---------- boot ---------- */
.boot {
  position: fixed; inset: 0; z-index: 150;
  display: grid; place-content: center; justify-items: center; gap: 18px;
  background: var(--paper);
  transition: opacity .5s var(--ease), visibility .5s;
}
.boot.is-done { opacity: 0; visibility: hidden; }
.boot p { margin: 0; color: var(--muted); font-size: 12px; letter-spacing: .24em; }
.boot-mark { display: flex; align-items: flex-end; gap: 5px; height: 34px; }
.boot-mark span {
  display: block; width: 4px; height: 100%; background: var(--jade); border-radius: 4px;
  animation: boot-wave 1.15s ease-in-out infinite;
}
.boot-mark span:nth-child(2) { height: 62%; background: var(--coral); animation-delay: .12s; }
.boot-mark span:nth-child(3) { height: 82%; animation-delay: .24s; }
@keyframes boot-wave { 0%, 100% { transform: scaleY(.45); opacity: .55; } 50% { transform: scaleY(1); opacity: 1; } }

/* ---------- topbar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 60;
  border-bottom: 1px solid rgba(196, 184, 162, .66);
  background: rgba(244, 239, 228, .86);
  backdrop-filter: blur(18px) saturate(1.1);
}
.topbar-inner {
  max-width: 1500px; margin: 0 auto;
  min-height: 72px; padding: 0 34px;
  display: flex; align-items: center; gap: 28px;
}
.brand { display: flex; align-items: center; gap: 11px; flex: none; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--ink); color: var(--paper-light);
  display: grid; place-items: center;
  font-family: var(--serif); font-size: 19px; line-height: 1;
  position: relative;
}
.brand-mark::after {
  content: ""; position: absolute; right: 2px; top: 3px;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--coral); border: 2px solid var(--paper);
}
.brand-word { display: flex; flex-direction: column; line-height: 1; }
.brand-word strong { font-family: var(--serif); font-size: 21px; letter-spacing: .12em; font-weight: 700; }
.brand-word small { margin-top: 5px; color: var(--muted); font-size: 9px; letter-spacing: .22em; text-transform: uppercase; }
.nav { display: flex; align-items: center; gap: 2px; margin-left: 4px; }
.nav a {
  position: relative; padding: 9px 13px; border-radius: 8px;
  color: var(--ink-soft); font-size: 13.5px; letter-spacing: .02em;
  transition: color .2s, background .2s;
}
.nav a:hover { color: var(--ink); background: rgba(255, 253, 248, .6); }
.nav a.is-active { color: var(--jade-dark); font-weight: 600; }
.nav a.is-active::after {
  content: ""; position: absolute; left: 13px; right: 13px; bottom: 4px;
  height: 2px; background: var(--coral); border-radius: 2px;
}
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 9px; }
.status-pill {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 10px; border: 1px solid var(--line);
  background: rgba(255, 253, 248, .52); border-radius: 999px;
  color: var(--ink-soft); font-size: 11px; white-space: nowrap;
}
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--jade); box-shadow: 0 0 0 3px rgba(20, 107, 88, .1); }
.status-dot.warn { background: var(--gold); box-shadow: 0 0 0 3px rgba(173, 132, 61, .12); }
.status-dot.off { background: var(--faint); box-shadow: none; }

/* ---------- generic ---------- */
.shell { max-width: 1500px; margin: 0 auto; padding: 0 34px 80px; }
#app { min-height: 100vh; display: flex; flex-direction: column; }
#main.shell { flex: 1 0 auto; width: 100%; }
.page { animation: page-in .55s var(--ease) both; }
@keyframes page-in { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: none; } }

.btn {
  --btn-bg: transparent;
  --btn-fg: var(--ink);
  --btn-line: var(--line-strong);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 40px; padding: 9px 16px;
  border: 1px solid var(--btn-line); border-radius: 9px;
  background: var(--btn-bg); color: var(--btn-fg);
  font-size: 13px; font-weight: 600; letter-spacing: .015em;
  transition: transform .18s var(--ease), background .18s, border-color .18s, box-shadow .18s, color .18s;
  white-space: nowrap;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 7px 18px rgba(55, 43, 25, .08); }
.btn:active { transform: translateY(0); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
.btn svg { width: 15px; height: 15px; flex: none; }
.btn-primary {
  --btn-bg: var(--jade); --btn-fg: #fdf9ef; --btn-line: var(--jade);
  box-shadow: 0 10px 24px rgba(20, 107, 88, .16);
}
.btn-primary:hover { --btn-bg: var(--jade-dark); --btn-line: var(--jade-dark); }
.btn-coral { --btn-bg: var(--coral); --btn-fg: #fff8f1; --btn-line: var(--coral); }
.btn-coral:hover { --btn-bg: var(--coral-dark); }
.btn-ghost { --btn-bg: rgba(255, 253, 248, .45); }
.btn-quiet { border-color: transparent; background: transparent; color: var(--muted); }
.btn-quiet:hover { color: var(--ink); background: rgba(255, 253, 248, .6); box-shadow: none; }
.btn-sm { min-height: 32px; padding: 6px 10px; font-size: 11.5px; border-radius: 7px; }
.btn-lg { min-height: 50px; padding: 13px 24px; font-size: 14px; border-radius: 11px; }
.icon-btn {
  width: 34px; height: 34px; display: inline-grid; place-items: center;
  border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--muted);
  transition: .18s;
}
.icon-btn:hover { color: var(--ink); background: rgba(23, 33, 28, .055); }
.icon-btn svg { width: 16px; height: 16px; }

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 8px; border-radius: 999px;
  border: 1px solid var(--line); background: rgba(255, 253, 248, .5);
  color: var(--ink-soft); font-size: 10.5px; line-height: 1.5; white-space: nowrap;
}
.chip.jade { border-color: rgba(20, 107, 88, .22); background: var(--jade-soft); color: var(--jade-dark); }
.chip.coral { border-color: rgba(210, 91, 65, .22); background: var(--coral-soft); color: var(--coral-dark); }
.chip.gold { border-color: rgba(173, 132, 61, .26); background: var(--gold-soft); color: #76551f; }
.chip.outline { background: transparent; }
.mono { font-family: var(--mono); }
.muted { color: var(--muted); }
.serif { font-family: var(--serif); }
.nowrap { white-space: nowrap; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

.select-wrap { position: relative; display: inline-flex; align-items: center; }
.select-wrap select {
  appearance: none; -webkit-appearance: none;
  min-height: 36px; padding: 7px 31px 7px 11px;
  border: 1px solid var(--line); border-radius: 8px;
  background: rgba(255, 253, 248, .58); color: var(--ink-soft);
  font-size: 12.5px; cursor: pointer;
  transition: border-color .18s, background .18s;
}
.select-wrap select:hover { border-color: var(--line-strong); background: var(--card); }
.select-wrap select:focus { border-color: var(--jade); }
.select-wrap::after {
  content: ""; position: absolute; right: 11px; top: 50%; width: 6px; height: 6px;
  border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted);
  transform: translateY(-70%) rotate(45deg); pointer-events: none;
}
.select-sm select { min-height: 30px; padding: 4px 27px 4px 9px; font-size: 11.5px; border-radius: 7px; }
.select-sm::after { right: 9px; }

.field { display: grid; gap: 6px; }
.field label { color: var(--ink-soft); font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
.field input, .field select, .field textarea {
  width: 100%; min-height: 42px; padding: 10px 12px;
  border: 1px solid var(--line); border-radius: 8px;
  background: var(--white); color: var(--ink); font-size: 13.5px;
  transition: border-color .18s, box-shadow .18s;
}
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--jade); outline: none; box-shadow: 0 0 0 3px rgba(20, 107, 88, .09);
}
.field .hint { color: var(--muted); font-size: 11px; line-height: 1.5; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.rule { height: 1px; background: var(--line); border: 0; margin: 0; }

/* ---------- hero ---------- */
.hero {
  position: relative;
  display: grid; grid-template-columns: minmax(0, 1fr) auto;
  gap: 42px; align-items: end;
  padding: 54px 0 34px;
}
.hero-copy { max-width: 820px; }
.eyebrow {
  display: flex; align-items: center; gap: 10px;
  margin: 0 0 16px; color: var(--jade);
  font-family: var(--mono); font-size: 10px; letter-spacing: .21em; text-transform: uppercase;
}
.eyebrow::before { content: ""; width: 26px; height: 1px; background: var(--coral); }
.hero h1 {
  margin: 0;
  font-family: var(--serif); font-weight: 600;
  font-size: clamp(35px, 4.2vw, 62px); line-height: 1.12; letter-spacing: -.025em;
}
.hero h1 em { font-style: normal; color: var(--jade); position: relative; }
.hero h1 em::after {
  content: ""; position: absolute; left: 2px; right: 0; bottom: .06em;
  height: 7px; background: rgba(210, 91, 65, .22); z-index: -1; border-radius: 2px;
}
.hero p.lede {
  margin: 18px 0 0; max-width: 600px;
  color: var(--ink-soft); font-size: 14.5px; line-height: 1.85;
}
.hero-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 22px; }
.hero-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--line-strong); }
.hero-meta span { color: var(--muted); font-size: 11px; }
.hero-aside { display: grid; gap: 10px; justify-items: end; padding-bottom: 4px; }
.hero-number {
  font-family: var(--serif); font-size: 64px; line-height: .9; color: transparent;
  -webkit-text-stroke: 1px var(--line-strong); letter-spacing: -.04em;
}
.hero-number small { display: block; -webkit-text-stroke: 0; color: var(--muted); font-family: var(--sans); font-size: 10px; letter-spacing: .18em; text-align: right; margin-top: 11px; }
.hero-stamp {
  display: flex; align-items: center; gap: 8px; padding: 7px 11px;
  border: 1px solid rgba(210, 91, 65, .35); border-radius: 3px;
  color: var(--coral-dark); font-family: var(--mono); font-size: 9px; letter-spacing: .13em;
  transform: rotate(-2.5deg); background: rgba(243, 223, 216, .35);
}
.hero-stamp svg { width: 13px; height: 13px; }

/* ---------- studio ---------- */
.studio {
  border: 1px solid var(--line-strong);
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow-md);
  overflow: hidden;
  animation: studio-in .65s .08s var(--ease) both;
}
@keyframes studio-in { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.studio-toolbar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 13px 18px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(to bottom, rgba(255, 253, 248, .7), rgba(244, 239, 228, .38));
}
.lang-group {
  display: flex; align-items: center; gap: 4px;
  padding: 3px; border: 1px solid var(--line); border-radius: 10px;
  background: rgba(255, 253, 248, .5);
}
.lang-group .select-wrap select { border: 0; background: transparent; min-height: 30px; font-weight: 600; color: var(--ink); }
.lang-group .select-wrap::after { right: 10px; }
.lang-group .select-wrap + .select-wrap::before {
  content: ""; position: absolute; left: -3px; top: 8px; bottom: 8px; width: 1px; background: var(--line);
}
.swap-btn { width: 28px; height: 28px; border: 0; border-radius: 50%; background: transparent; color: var(--muted); display: grid; place-items: center; transition: .2s; }
.swap-btn:hover { background: var(--paper-deep); color: var(--ink); transform: rotate(180deg); }
.swap-btn svg { width: 14px; height: 14px; }
.toolbar-spacer { flex: 1; }
.provider-select select { min-height: 36px; font-size: 12px; }
.studio-toolbar .btn-primary { min-height: 38px; padding-inline: 19px; }
.kbd {
  display: inline-flex; align-items: center; padding: 1px 5px; border: 1px solid rgba(255,255,255,.25);
  border-radius: 4px; font-family: var(--mono); font-size: 9px; opacity: .7;
}

.workspace-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.02fr) minmax(0, 1.18fr) 326px;
  align-items: stretch;
}
.pane { min-width: 0; display: flex; flex-direction: column; background: var(--card); }
.pane + .pane { border-left: 1px solid var(--line); }
.pane-head {
  min-height: 50px; padding: 11px 18px;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  border-bottom: 1px solid var(--line);
}
.pane-title { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: .07em; }
.pane-title .ord { color: var(--coral); font-family: var(--mono); font-size: 9px; font-weight: 400; }
.pane-title .count { color: var(--muted); font-weight: 400; letter-spacing: 0; }
.pane-tools { margin-left: auto; display: flex; align-items: center; gap: 2px; }
.pane-body { position: relative; flex: 1; min-height: 0; }

.source-pane { background: #fcf9f1; }
.source-area-wrap { position: relative; height: 100%; display: flex; flex-direction: column; }
#source-text {
  width: 100%; flex: 1; min-height: 548px; max-height: 68vh;
  padding: 24px 26px 20px; border: 0; outline: 0; resize: vertical;
  background: transparent; color: var(--ink);
  font-family: var(--serif); font-size: 16.5px; line-height: 1.92;
  caret-color: var(--coral);
}
#source-text::placeholder { color: #9b9b8e; font-style: italic; }
.source-foot {
  min-height: 48px; padding: 8px 16px 10px;
  display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
  border-top: 1px solid rgba(218, 209, 192, .7);
  background: rgba(251, 248, 240, .7);
}
.source-foot .btn { min-height: 31px; padding: 5px 9px; font-size: 11px; border-color: transparent; color: var(--ink-soft); }
.source-foot .btn:hover { background: var(--paper-deep); box-shadow: none; }
.source-foot .meta { margin-left: auto; color: var(--faint); font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em; }
.dirty-flag { display: none; color: var(--coral-dark); font-size: 10px; align-items: center; gap: 5px; }
.is-dirty .dirty-flag { display: inline-flex; }

.drop-overlay {
  position: absolute; inset: 10px; z-index: 10;
  display: none; place-content: center; justify-items: center; gap: 10px;
  border: 1.5px dashed var(--jade); border-radius: 10px;
  background: rgba(237, 243, 238, .94); color: var(--jade-dark);
  text-align: center; padding: 20px;
}
.drop-overlay.is-on { display: grid; }
.drop-overlay strong { font-family: var(--serif); font-size: 22px; }
.drop-overlay span { color: var(--ink-soft); font-size: 12px; }

.result-pane { background: var(--card); }
.result-tabs { display: flex; gap: 1px; padding: 3px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); }
.result-tabs button {
  border: 0; background: transparent; padding: 4px 10px; border-radius: 6px;
  color: var(--muted); font-size: 10.5px; font-weight: 600;
}
.result-tabs button.is-active { background: var(--white); color: var(--ink); box-shadow: 0 1px 4px rgba(55, 43, 25, .08); }
.result-body { min-height: 548px; max-height: 68vh; overflow: auto; padding: 26px 28px 40px; scroll-behavior: smooth; }
.font-controls {
  display: inline-flex; align-items: center; gap: 1px; padding: 2px;
  border: 1px solid var(--line); border-radius: 7px; background: var(--paper-light);
  margin-right: 4px;
}
.font-controls button {
  min-width: 24px; height: 24px; border: 0; background: transparent; border-radius: 5px;
  color: var(--ink-soft); font-family: var(--mono); font-size: 10px; line-height: 1;
}
.font-controls button:hover { background: var(--jade-wash); color: var(--jade); }
.font-controls span { min-width: 31px; text-align: center; color: var(--muted); font-family: var(--mono); font-size: 8px; }
.result-body::-webkit-scrollbar, .rail-scroll::-webkit-scrollbar, .modal-body::-webkit-scrollbar { width: 9px; }
.result-body::-webkit-scrollbar-thumb, .rail-scroll::-webkit-scrollbar-thumb, .modal-body::-webkit-scrollbar-thumb {
  background: rgba(121, 128, 119, .25); border-radius: 9px; border: 2px solid var(--card);
}

.empty-state {
  min-height: 490px; display: grid; place-content: center; justify-items: center;
  text-align: center; padding: 30px;
}
.empty-glyph {
  font-family: var(--serif); font-size: 106px; line-height: 1;
  color: transparent; -webkit-text-stroke: 1px var(--line-strong);
  opacity: .65; margin-bottom: 8px; user-select: none;
}
.empty-state h3 { margin: 0; font-family: var(--serif); font-size: 23px; font-weight: 500; }
.empty-state p { max-width: 320px; margin: 10px 0 18px; color: var(--muted); font-size: 12.5px; line-height: 1.8; }
.empty-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

.loading-state { display: grid; gap: 18px; padding: 8px 0; }
.loading-note { display: flex; align-items: center; gap: 9px; color: var(--jade); font-size: 11px; letter-spacing: .08em; }
.spinner { width: 14px; height: 14px; border: 1.5px solid rgba(20, 107, 88, .2); border-top-color: var(--jade); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.skeleton-line { height: 13px; border-radius: 3px; background: linear-gradient(90deg, #eee7d9 25%, #faf6ed 50%, #eee7d9 75%); background-size: 220% 100%; animation: shimmer 1.6s infinite; }
.skeleton-line:nth-child(3n) { width: 88%; }
.skeleton-line:nth-child(4n) { width: 72%; }
.skeleton-line.title { height: 25px; width: 52%; margin-bottom: 8px; }
@keyframes shimmer { to { background-position: -220% 0; } }

.warning-list { display: grid; gap: 7px; margin: 0 0 18px; }
.warning-item {
  display: flex; gap: 8px; align-items: flex-start;
  padding: 8px 10px; border: 1px solid rgba(173, 132, 61, .28);
  background: rgba(239, 228, 204, .4); border-radius: 7px;
  color: #6e5427; font-size: 10.5px; line-height: 1.55;
}
.warning-item svg { width: 13px; height: 13px; flex: none; margin-top: 1px; }

/* translated article */
.article-prose { font-size: calc(15.5px * var(--reading-scale, 1)); line-height: 1.98; color: #253129; }
.article-prose .art-h1, .article-prose .art-h2, .article-prose .art-h3 {
  font-family: var(--serif); color: var(--ink); font-weight: 600; line-height: 1.3;
  margin: 1.55em 0 .55em; letter-spacing: -.01em;
}
.article-prose .art-h1 { font-size: 27px; margin-top: .2em; }
.article-prose .art-h2 { font-size: 22px; }
.article-prose .art-h3, .article-prose .art-h4 { font-size: 18px; }
.article-prose p { margin: 0 0 1.05em; }
.article-prose .art-list { margin: 0 0 1.1em; padding-left: 1.3em; }
.article-prose .art-list li { margin-bottom: .35em; padding-left: .2em; }
.article-prose .art-list li::marker { color: var(--coral); }
.article-prose blockquote {
  margin: 1.4em 0; padding: 2px 0 2px 18px;
  border-left: 2px solid var(--coral); color: var(--ink-soft);
  font-family: var(--serif); font-size: 17px; font-style: italic;
}
.article-prose .art-code {
  margin: 1em 0; padding: 14px 16px; border-radius: 8px;
  background: #202823; color: #e8e2d5; font-family: var(--mono); font-size: 12px;
  overflow: auto; white-space: pre-wrap;
}
.article-prose .art-table { overflow: auto; margin: 1em 0; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.article-prose .art-table pre { margin: 0; white-space: pre; }
.article-prose hr { border: 0; height: 1px; background: var(--line); margin: 1.8em 0; }
.article-prose .art-p { position: relative; }
.article-prose .art-p:hover::before { content: ""; position: absolute; left: -18px; top: .65em; width: 5px; height: 5px; border-radius: 50%; background: var(--coral); opacity: .6; }
.article-prose strong { color: var(--ink); }

/* bilingual rows */
.bilingual-list { display: grid; gap: 0; border-top: 1px solid var(--line); }
.bi-row {
  display: grid; grid-template-columns: 34px minmax(0, 1fr) minmax(0, 1.08fr);
  border-bottom: 1px solid rgba(218, 209, 192, .62);
  transition: background .18s;
}
.bi-row:hover { background: rgba(237, 243, 238, .42); }
.bi-num {
  padding: 15px 6px 15px 0; color: var(--faint);
  font-family: var(--mono); font-size: 9px; text-align: right;
}
.bi-source, .bi-target { padding: 14px 16px 17px 12px; min-width: 0; }
.bi-source { color: var(--ink-soft); font-family: var(--serif); font-size: calc(14px * var(--reading-scale, 1)); line-height: 1.8; border-right: 1px solid rgba(218, 209, 192, .55); }
.bi-target { color: var(--ink); font-size: calc(14px * var(--reading-scale, 1)); line-height: 1.85; }
.bi-row.is-heading .bi-source, .bi-row.is-heading .bi-target { font-family: var(--serif); font-weight: 600; font-size: 17px; }
.bi-row.is-heading { background: rgba(237, 243, 238, .35); }
.bi-row.is-code .bi-source, .bi-row.is-code .bi-target { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.bi-labels { display: none; }
.bi-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.bi-chips .chip { font-size: 9px; padding: 1px 6px; }

/* grammar rail */
.grammar-rail { background: #f7f2e7; display: flex; flex-direction: column; }
.rail-head { padding: 17px 18px 13px; border-bottom: 1px solid var(--line); }
.rail-title { display: flex; align-items: center; gap: 8px; }
.rail-title h3 { margin: 0; font-family: var(--serif); font-size: 18px; font-weight: 600; }
.rail-title .count-badge {
  margin-left: auto; min-width: 28px; height: 23px; padding: 0 7px;
  display: inline-grid; place-items: center; border-radius: 999px;
  background: var(--jade); color: var(--white); font-family: var(--mono); font-size: 10px;
}
.rail-sub { margin: 6px 0 0; color: var(--muted); font-size: 10.5px; }
.rail-stats { display: flex; gap: 3px; height: 4px; margin-top: 12px; border-radius: 4px; overflow: hidden; background: var(--paper-deep); }
.rail-stats span { height: 100%; background: var(--jade); opacity: .75; }
.rail-stats span:nth-child(2n) { background: var(--coral); opacity: .7; }
.rail-stats span:nth-child(3n) { background: var(--gold); opacity: .7; }
.rail-scroll { overflow: auto; max-height: 575px; flex: 1; }
.rail-empty { padding: 40px 20px; text-align: center; color: var(--muted); }
.rail-empty .seal {
  width: 42px; height: 42px; margin: 0 auto 12px; display: grid; place-items: center;
  border: 1px solid var(--line-strong); border-radius: 50%; color: var(--line-strong);
  font-family: var(--serif); font-size: 18px;
}
.rail-empty p { margin: 0; font-size: 11px; line-height: 1.7; }
.grammar-mini {
  display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid rgba(218, 209, 192, .7);
  background: transparent; padding: 13px 17px 14px;
  transition: background .18s, padding-left .2s var(--ease);
}
.grammar-mini:hover { background: rgba(255, 253, 248, .65); padding-left: 20px; }
.grammar-mini-top { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
.grammar-mini-top .cat { color: var(--muted); font-size: 9.5px; letter-spacing: .08em; }
.grammar-mini-top .times { margin-left: auto; color: var(--faint); font-family: var(--mono); font-size: 9px; }
.grammar-mini h4 { margin: 0; font-family: var(--serif); font-size: 15px; font-weight: 600; line-height: 1.4; }
.grammar-mini h4 small { margin-left: 5px; color: var(--muted); font-family: var(--sans); font-size: 9px; font-weight: 400; letter-spacing: .04em; }
.grammar-mini .formula {
  margin: 5px 0 0; color: var(--ink-soft); font-family: var(--mono); font-size: 9.5px; line-height: 1.55;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.grammar-mini-summary { margin: 5px 0 0; color: var(--muted); font-size: 9.5px; line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.grammar-mini-quote { margin: 6px 0 0; padding: 5px 7px; border-left: 2px solid var(--coral); background: var(--coral-soft); color: var(--ink-soft); font-family: var(--serif); font-size: 9.5px; line-height: 1.55; }
.grammar-mini-quote mark { padding: 0 1px; background: rgba(226, 125, 100, .28); color: var(--coral-dark); }
.rail-report { margin-top: 9px; display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 4px; padding: 4px 7px; background: var(--card); color: var(--jade); font-size: 8.5px; }
.rail-report:hover { border-color: var(--jade); background: var(--jade-wash); }
.grammar-report .report-summary { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 16px; }
.grammar-report .report-summary span { display: inline-flex; gap: 5px; padding: 4px 7px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); font-size: 9px; }
.grammar-report .report-summary b { color: var(--coral); font-weight: 500; }
.grammar-report .report-group { margin-bottom: 14px; }
.grammar-report .report-group > h3 { margin: 0 0 4px; padding: 6px 0; border-bottom: 1px solid var(--line); font-family: var(--sans); font-size: 11px; }
.grammar-report .report-group > h3 small { margin-left: 6px; color: var(--faint); font-weight: 400; }
.grammar-report .grammar-mini { padding: 10px 4px 11px; }
.grammar-report .grammar-mini:hover { padding-left: 9px; }
.grammar-report .report-note { margin: 14px 0 0; color: var(--faint); font-size: 9px; line-height: 1.7; }
.grammar-mini .open-hint { display: inline-flex; align-items: center; gap: 4px; margin-top: 7px; color: var(--jade); font-size: 9.5px; font-weight: 600; opacity: 0; transform: translateX(-4px); transition: .18s; }
.grammar-mini:hover .open-hint { opacity: 1; transform: none; }
.grammar-mini .open-hint svg { width: 11px; height: 11px; }
.rail-foot { padding: 12px 14px; border-top: 1px solid var(--line); background: rgba(255, 253, 248, .35); }
.rail-foot .btn { width: 100%; }

/* ---------- section headers ---------- */
.section-head { display: flex; align-items: end; gap: 20px; margin: 54px 0 20px; }
.section-head h2 { margin: 0; font-family: var(--serif); font-size: 27px; font-weight: 600; letter-spacing: -.02em; }
.section-head p { margin: 0 0 3px; color: var(--muted); font-size: 11.5px; }
.section-head .line { flex: 1; height: 1px; background: var(--line); margin-bottom: 8px; }

/* ---------- feature strip ---------- */
.features { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: rgba(251, 248, 240, .55); }
.feature { padding: 20px 20px 21px; position: relative; }
.feature + .feature { border-left: 1px solid var(--line); }
.feature .no { font-family: var(--mono); font-size: 9px; color: var(--coral); letter-spacing: .13em; }
.feature h3 { margin: 8px 0 4px; font-family: var(--serif); font-size: 16px; font-weight: 600; }
.feature p { margin: 0; color: var(--muted); font-size: 10.5px; line-height: 1.65; }
.feature .icon { position: absolute; right: 16px; top: 16px; color: var(--line-strong); }
.feature .icon svg { width: 17px; height: 17px; }

/* ---------- page hero (subpages) ---------- */
.page-hero {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 34px; align-items: end;
  padding: 48px 0 28px; border-bottom: 1px solid var(--line);
}
.page-hero .eyebrow { margin-bottom: 13px; }
.page-hero h1 { margin: 0; font-family: var(--serif); font-weight: 600; font-size: clamp(34px, 4vw, 52px); line-height: 1.1; letter-spacing: -.025em; }
.page-hero .lede { max-width: 640px; margin: 14px 0 0; color: var(--ink-soft); font-size: 13.5px; line-height: 1.8; }
.page-hero-stats { display: flex; gap: 22px; padding-bottom: 5px; }
.big-stat { text-align: right; }
.big-stat strong { display: block; font-family: var(--serif); font-size: 31px; line-height: 1; font-weight: 500; }
.big-stat span { color: var(--muted); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; }

/* ---------- grammar index ---------- */
.atlas-section { margin: 34px 0 0; padding: 28px 0 8px; border-top: 1px solid var(--line); }
.atlas-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 36px; margin-bottom: 18px; }
.atlas-head h2 { margin: 5px 0 0; font-family: var(--serif); font-size: clamp(24px, 2.6vw, 34px); font-weight: 600; line-height: 1.25; letter-spacing: -.02em; }
.atlas-head h2 em { font-style: normal; color: var(--jade); }
.atlas-intro { max-width: 430px; margin: 0 0 3px; color: var(--ink-soft); font-size: 11.5px; line-height: 1.8; }
.atlas-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.atlas-card {
  display: flex; flex-direction: column; gap: 2px; min-height: 94px;
  padding: 10px 11px; text-align: left;
  border: 1px solid var(--line); border-radius: 9px;
  background: rgba(253, 250, 243, .62);
  transition: transform .16s var(--ease), border-color .16s, background .16s, box-shadow .16s;
}
.atlas-card:hover { transform: translateY(-2px); border-color: var(--line-strong); background: var(--card); box-shadow: var(--shadow-sm); }
.atlas-card.is-active { border-color: var(--jade); background: var(--jade); color: var(--white); box-shadow: 0 8px 22px rgba(20, 107, 88, .18); }
.atlas-card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.atlas-code { font-family: var(--mono); font-size: 8.5px; letter-spacing: .12em; color: var(--jade); }
.atlas-count { font-family: var(--mono); font-size: 8.5px; color: var(--muted); }
.atlas-card strong { font-family: var(--serif); font-size: 14.5px; font-weight: 600; line-height: 1.25; }
.atlas-native { color: var(--muted); font-size: 9.5px; line-height: 1.5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.atlas-family { margin-top: auto; color: var(--muted); font-size: 8.5px; line-height: 1.5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.atlas-card.is-active .atlas-code, .atlas-card.is-active .atlas-count,
.atlas-card.is-active .atlas-native, .atlas-card.is-active .atlas-family { color: rgba(255, 255, 255, .72); }
.atlas-note { margin: 13px 0 0; padding-left: 10px; border-left: 2px solid var(--jade); color: var(--muted); font-size: 10.5px; line-height: 1.75; }
html[data-theme="night"] .atlas-card { background: rgba(255, 255, 255, .035); border-color: rgba(255, 255, 255, .1); }
html[data-theme="night"] .atlas-card:hover { background: rgba(255, 255, 255, .07); border-color: rgba(255, 255, 255, .2); }
html[data-theme="night"] .atlas-card.is-active { background: var(--jade); border-color: var(--jade); }
html[data-theme="night"] .atlas-card .atlas-native,
html[data-theme="night"] .atlas-card .atlas-family { color: rgba(233, 240, 234, .55); }
html[data-theme="night"] .atlas-card strong { color: #edf3ee; }
html[data-theme="clear"] .atlas-card { background: #fff; border-color: #e3ebe5; }
html[data-theme="clear"] .atlas-card:hover { background: #f7fbf8; }
html[data-theme="clear"] .atlas-card.is-active { background: var(--jade); border-color: var(--jade); }

.index-layout { display: grid; grid-template-columns: 248px minmax(0, 1fr); gap: 34px; padding-top: 28px; align-items: start; }
.filter-panel { position: sticky; top: 98px; }
.search-box { position: relative; margin-bottom: 20px; }
.search-box svg { position: absolute; left: 12px; top: 50%; width: 15px; height: 15px; transform: translateY(-50%); color: var(--muted); }
.search-box input {
  width: 100%; height: 42px; padding: 0 12px 0 36px;
  border: 1px solid var(--line); border-radius: 9px; background: var(--white);
  font-size: 12.5px;
}
.search-box input:focus { outline: 0; border-color: var(--jade); box-shadow: 0 0 0 3px rgba(20, 107, 88, .08); }
.filter-group { margin-bottom: 20px; }
.filter-group h4 { margin: 0 0 8px; color: var(--muted); font-size: 9.5px; font-weight: 600; letter-spacing: .15em; text-transform: uppercase; }
.filter-list { display: flex; flex-wrap: wrap; gap: 5px; }
.filter-btn {
  border: 1px solid var(--line); background: transparent; border-radius: 7px;
  padding: 5px 9px; color: var(--ink-soft); font-size: 11px;
  transition: .16s;
}
.filter-btn:hover { border-color: var(--line-strong); background: rgba(255, 253, 248, .7); }
.filter-btn.is-active { border-color: var(--jade); background: var(--jade); color: var(--white); }
.filter-note { border-top: 1px solid var(--line); padding-top: 14px; color: var(--muted); font-size: 10px; line-height: 1.7; }
.index-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.index-toolbar .result-count { color: var(--muted); font-size: 11px; }
.index-toolbar .result-count strong { color: var(--ink); font-family: var(--serif); font-size: 16px; }
.index-toolbar .sort { margin-left: auto; }
.grammar-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
.grammar-card {
  position: relative; display: flex; flex-direction: column;
  padding: 19px 19px 15px; border: 1px solid var(--line); border-radius: 11px;
  background: rgba(253, 250, 243, .75); min-height: 190px;
  transition: transform .22s var(--ease), box-shadow .22s, border-color .22s, background .22s;
}
.grammar-card:hover { transform: translateY(-3px); border-color: var(--line-strong); background: var(--card); box-shadow: var(--shadow-md); }
.grammar-card-top { display: flex; align-items: center; gap: 6px; margin-bottom: 9px; }
.grammar-card-top .lang { font-family: var(--mono); font-size: 8.5px; letter-spacing: .1em; color: var(--muted); }
.grammar-card-top .spacer { flex: 1; }
.grammar-card h3 { margin: 0; font-family: var(--serif); font-size: 20px; font-weight: 600; line-height: 1.25; }
.grammar-card .en { margin: 2px 0 0; color: var(--muted); font-family: var(--serif); font-size: 11.5px; font-style: italic; }
.grammar-card .sum { margin: 10px 0 12px; color: var(--ink-soft); font-size: 11.5px; line-height: 1.65; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.grammar-card .formula {
  margin-top: auto; padding: 7px 9px; border-radius: 6px;
  background: var(--jade-wash); color: var(--jade-dark);
  font-family: var(--mono); font-size: 9.5px; line-height: 1.5;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.grammar-card .card-foot { display: flex; align-items: center; margin-top: 10px; color: var(--jade); font-size: 10px; font-weight: 600; }
.grammar-card .card-foot svg { width: 12px; height: 12px; margin-left: 4px; transition: transform .18s; }
.grammar-card:hover .card-foot svg { transform: translateX(4px); }
.empty-index { grid-column: 1 / -1; padding: 70px 20px; text-align: center; border: 1px dashed var(--line-strong); border-radius: 12px; }
.empty-index h3 { margin: 0 0 6px; font-family: var(--serif); font-size: 22px; font-weight: 500; }
.empty-index p { margin: 0; color: var(--muted); font-size: 12px; }

/* ---------- grammar detail ---------- */
.detail-top { padding: 26px 0 0; }
.breadcrumb { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 10.5px; }
.breadcrumb a:hover { color: var(--jade); }
.breadcrumb .sep { color: var(--line-strong); }
.detail-hero {
  display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(300px, .7fr);
  gap: 46px; align-items: end;
  padding: 26px 0 33px; border-bottom: 1px solid var(--line);
}
.detail-kicker { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-bottom: 12px; }
.detail-hero h1 { margin: 0; font-family: var(--serif); font-size: clamp(35px, 4.4vw, 57px); line-height: 1.1; font-weight: 600; letter-spacing: -.025em; }
.detail-hero .en-title { margin: 6px 0 0; color: var(--muted); font-family: var(--serif); font-size: 18px; font-style: italic; }
.detail-summary { max-width: 680px; margin: 16px 0 0; color: var(--ink-soft); font-size: 14px; line-height: 1.85; }
.formula-card {
  position: relative; padding: 20px 20px 18px;
  border: 1px solid var(--line-strong); border-radius: 10px;
  background: var(--jade-wash); box-shadow: var(--shadow-sm);
}
.formula-card::before {
  content: "FORMULA"; position: absolute; right: 14px; top: 11px;
  color: rgba(20, 107, 88, .45); font-family: var(--mono); font-size: 8px; letter-spacing: .17em;
}
.formula-card .label { color: var(--jade); font-family: var(--mono); font-size: 9px; letter-spacing: .13em; }
.formula-card .formula { margin: 10px 0 0; color: var(--jade-dark); font-family: var(--mono); font-size: 13px; line-height: 1.75; word-break: break-word; }
.formula-card .mini-note { margin-top: 13px; padding-top: 11px; border-top: 1px solid rgba(20, 107, 88, .14); color: var(--ink-soft); font-size: 10px; }
.detail-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.detail-layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 48px; padding: 34px 0 30px; align-items: start; }
.detail-main { min-width: 0; }
.content-section { margin-bottom: 38px; }
.content-section h2 {
  display: flex; align-items: center; gap: 10px;
  margin: 0 0 13px; font-family: var(--serif); font-size: 23px; font-weight: 600;
}
.content-section h2 .num {
  display: inline-grid; place-items: center; width: 25px; height: 25px;
  border: 1px solid var(--line-strong); border-radius: 50%;
  color: var(--coral); font-family: var(--mono); font-size: 9px; font-weight: 400;
}
.content-section p { margin: 0 0 11px; color: var(--ink-soft); font-size: 14px; line-height: 1.92; }
.bullet-list { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.bullet-list li { position: relative; padding-left: 19px; color: var(--ink-soft); font-size: 13px; line-height: 1.8; }
.bullet-list li::before { content: ""; position: absolute; left: 3px; top: .7em; width: 6px; height: 1px; background: var(--coral); }
.example-list { display: grid; gap: 10px; }
.example-card {
  display: grid; grid-template-columns: 28px minmax(0, 1fr);
  gap: 12px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 9px;
  background: rgba(253, 250, 243, .65);
}
.example-card .ex-no { color: var(--coral); font-family: var(--mono); font-size: 9px; padding-top: 4px; }
.example-card .ex-src { margin: 0; font-family: var(--serif); font-size: 16px; line-height: 1.65; color: var(--ink); }
.example-card .ex-tr { margin: 5px 0 0; color: var(--muted); font-size: 12.5px; line-height: 1.7; }
.pitfall-grid { display: grid; gap: 10px; }
.pitfall-card {
  display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
  border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--line);
}
.pitfall-cell { padding: 13px 15px; background: var(--card); }
.pitfall-cell.bad { background: rgba(243, 223, 216, .38); }
.pitfall-cell.good { background: rgba(220, 233, 225, .38); }
.pitfall-cell .tag { display: inline-flex; align-items: center; gap: 4px; margin-bottom: 5px; font-family: var(--mono); font-size: 8.5px; letter-spacing: .1em; }
.pitfall-cell.bad .tag { color: var(--coral-dark); }
.pitfall-cell.good .tag { color: var(--jade-dark); }
.pitfall-cell p { margin: 0; font-size: 13px; line-height: 1.65; }
.pitfall-why { grid-column: 1 / -1; padding: 9px 15px; background: rgba(244, 239, 228, .8); color: var(--ink-soft); font-size: 10.5px; line-height: 1.6; }
.detail-side { position: sticky; top: 96px; display: grid; gap: 22px; }
.side-card { border-top: 1px solid var(--line-strong); padding-top: 13px; }
.side-card h3 { margin: 0 0 11px; color: var(--muted); font-size: 9.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
.occurrence { padding: 10px 0; border-bottom: 1px solid rgba(218, 209, 192, .65); }
.occurrence:last-child { border-bottom: 0; }
.occurrence .occ-label { color: var(--coral); font-family: var(--mono); font-size: 8.5px; letter-spacing: .08em; }
.occurrence p { margin: 4px 0 0; font-family: var(--serif); font-size: 12.5px; line-height: 1.7; color: var(--ink-soft); }
.side-empty { color: var(--faint); font-size: 10.5px; line-height: 1.7; }
.side-link {
  display: flex; align-items: center; gap: 8px; padding: 9px 0;
  border-bottom: 1px solid rgba(218, 209, 192, .65);
  color: var(--ink-soft); font-size: 11.5px; transition: color .16s;
}
.side-link:last-child { border-bottom: 0; }
.side-link:hover { color: var(--jade); }
.side-link .site { margin-left: auto; color: var(--faint); font-family: var(--mono); font-size: 8px; }
.side-link svg { width: 12px; height: 12px; flex: none; color: var(--muted); }
.related-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 4px; }
.related-card { padding: 14px 15px; border: 1px solid var(--line); border-radius: 8px; background: rgba(253, 250, 243, .55); transition: .18s; }
.related-card:hover { border-color: var(--jade); background: var(--card); transform: translateY(-2px); }
.related-card .rc-cat { color: var(--muted); font-size: 8.5px; letter-spacing: .08em; }
.related-card h4 { margin: 4px 0 0; font-family: var(--serif); font-size: 14px; font-weight: 600; }
.related-card p { margin: 3px 0 0; color: var(--muted); font-size: 9.5px; }

/* ---------- batch ---------- */
.batch-hero { padding: 48px 0 30px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 40px; align-items: end; }
.batch-hero h1 { margin: 0; font-family: var(--serif); font-size: clamp(35px, 4.2vw, 56px); line-height: 1.1; font-weight: 600; letter-spacing: -.025em; }
.batch-hero p { max-width: 620px; margin: 15px 0 0; color: var(--ink-soft); font-size: 13.5px; line-height: 1.85; }
.format-strip { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 17px; }
.format-strip .chip { font-family: var(--mono); font-size: 8.5px; letter-spacing: .03em; }
.batch-shell { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 18px; align-items: start; }
.panel-card {
  border: 1px solid var(--line); border-radius: 12px; background: var(--card);
  box-shadow: var(--shadow-sm); overflow: hidden;
}
.panel-card-head { display: flex; align-items: center; gap: 9px; padding: 15px 19px; border-bottom: 1px solid var(--line); }
.panel-card-head h2 { margin: 0; font-family: var(--serif); font-size: 18px; font-weight: 600; }
.panel-card-head .step { display: inline-grid; place-items: center; width: 21px; height: 21px; border-radius: 50%; background: var(--jade); color: var(--white); font-family: var(--mono); font-size: 8.5px; }
.panel-card-head .right { margin-left: auto; }
.panel-card-body { padding: 19px; }
.folder-input { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.folder-input input { font-family: var(--mono); font-size: 11.5px; }
.folder-tips { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 9px; color: var(--muted); font-size: 10px; }
.folder-tips span { display: inline-flex; align-items: center; gap: 4px; }
.folder-tips svg { width: 11px; height: 11px; color: var(--jade); }
.scan-result { margin-top: 18px; border-top: 1px dashed var(--line-strong); padding-top: 15px; display: none; }
.scan-result.is-on { display: block; animation: page-in .3s both; }
.scan-summary { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.scan-summary .big { font-family: var(--serif); font-size: 30px; line-height: 1; }
.scan-summary .big small { font-family: var(--sans); font-size: 10px; color: var(--muted); margin-left: 4px; }
.scan-summary .out-path { margin-left: auto; color: var(--muted); font-family: var(--mono); font-size: 9px; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-list { margin-top: 12px; max-height: 210px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
.file-row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 7px 10px; border-bottom: 1px solid rgba(218, 209, 192, .55); font-size: 10.5px; }
.file-row:last-child { border-bottom: 0; }
.file-row .fmt { color: var(--muted); font-family: var(--mono); font-size: 8px; text-transform: uppercase; }
.file-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-row .size { color: var(--faint); font-family: var(--mono); font-size: 8.5px; }
.batch-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.batch-controls .btn { grid-column: 1 / -1; }
.privacy-note { display: flex; gap: 8px; align-items: flex-start; margin-top: 12px; color: var(--muted); font-size: 9.5px; line-height: 1.65; }
.privacy-note svg { width: 12px; height: 12px; flex: none; margin-top: 1px; color: var(--jade); }

.job-empty { min-height: 330px; display: grid; place-content: center; justify-items: center; text-align: center; padding: 24px; }
.job-empty .ring { width: 64px; height: 64px; border: 1px solid var(--line-strong); border-radius: 50%; display: grid; place-items: center; color: var(--line-strong); margin-bottom: 12px; }
.job-empty .ring svg { width: 25px; height: 25px; }
.job-empty h3 { margin: 0; font-family: var(--serif); font-size: 20px; font-weight: 500; }
.job-empty p { max-width: 300px; margin: 7px 0 0; color: var(--muted); font-size: 11px; line-height: 1.7; }
.job-live { display: none; }
.job-live.is-on { display: block; animation: page-in .35s both; }
.job-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.job-status { display: inline-flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 700; letter-spacing: .07em; color: var(--jade); }
.job-status .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--jade); animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(20,107,88,.25); } 50% { box-shadow: 0 0 0 5px rgba(20,107,88,0); } }
.job-head .job-id { margin-left: auto; color: var(--faint); font-family: var(--mono); font-size: 8.5px; }
.progress-wrap { margin: 16px 0 10px; }
.progress-meta { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.progress-meta strong { font-family: var(--serif); font-size: 28px; line-height: 1; font-weight: 500; }
.progress-meta span { color: var(--muted); font-size: 9.5px; }
.progress-meta .pct { margin-left: auto; color: var(--jade); font-family: var(--mono); font-size: 10px; }
.progress-bar { height: 5px; background: var(--paper-deep); border-radius: 5px; overflow: hidden; }
.progress-bar span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--jade), #3f9b83); border-radius: 5px; transition: width .5s var(--ease); }
.job-current { margin-top: 8px; color: var(--muted); font-family: var(--mono); font-size: 9px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.job-files { margin-top: 14px; border: 1px solid var(--line); border-radius: 8px; max-height: 235px; overflow: auto; }
.job-file { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 7px; align-items: center; padding: 7px 10px; border-bottom: 1px solid rgba(218, 209, 192, .55); font-size: 10px; }
.job-file:last-child { border-bottom: 0; }
.job-file .state { width: 13px; height: 13px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--line); }
.job-file .state svg { width: 8px; height: 8px; }
.job-file.done .state { background: var(--jade); border-color: var(--jade); color: white; }
.job-file.failed .state { background: var(--coral); border-color: var(--coral); color: white; }
.job-file.running .state { border-color: var(--jade); border-top-color: transparent; animation: spin .7s linear infinite; }
.job-file .error { color: var(--coral-dark); font-size: 8px; }
.job-file .meta { color: var(--faint); font-family: var(--mono); font-size: 8px; }
.job-actions { display: flex; gap: 8px; margin-top: 13px; flex-wrap: wrap; }
.recent-jobs { margin-top: 48px; }
.recent-job-row { display: grid; grid-template-columns: 1fr auto auto auto; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.recent-job-row .folder { font-family: var(--mono); font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recent-job-row .time { color: var(--muted); font-size: 9.5px; }
.recent-job-row .ratio { color: var(--muted); font-family: var(--mono); font-size: 9.5px; }

/* ---------- history ---------- */
.history-list { display: grid; gap: 12px; padding-top: 26px; }
.history-toolbar { display: flex; align-items: center; gap: 14px; margin-top: 24px; }
.history-toolbar .search-box { margin: 0; width: min(420px, 100%); }
.history-count { color: var(--muted); font-family: var(--mono); font-size: 9.5px; white-space: nowrap; }
.history-card {
  display: grid; grid-template-columns: 78px minmax(0, 1fr) auto; gap: 20px;
  padding: 20px 22px; border: 1px solid var(--line); border-radius: 11px;
  background: rgba(253, 250, 243, .62); transition: .2s;
}
.history-card:hover { border-color: var(--line-strong); background: var(--card); box-shadow: var(--shadow-sm); }
.history-date { text-align: center; padding-right: 16px; border-right: 1px solid var(--line); }
.history-date strong { display: block; font-family: var(--serif); font-size: 31px; line-height: 1; font-weight: 500; }
.history-date span { display: block; margin-top: 5px; color: var(--muted); font-family: var(--mono); font-size: 8.5px; letter-spacing: .08em; text-transform: uppercase; }
.history-main { min-width: 0; }
.history-main h3 { margin: 0; font-family: var(--serif); font-size: 19px; font-weight: 600; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.history-main .meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-top: 6px; }
.history-main p { margin: 8px 0 0; color: var(--muted); font-size: 11px; line-height: 1.65; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.history-side { display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; gap: 10px; }
.history-actions { display: flex; gap: 3px; }
.star-btn.is-on { color: var(--gold); }
.empty-page { min-height: 430px; display: grid; place-content: center; justify-items: center; text-align: center; }
.empty-page .glyph { font-family: var(--serif); font-size: 80px; line-height: 1; color: transparent; -webkit-text-stroke: 1px var(--line-strong); margin-bottom: 14px; }
.empty-page h2 { margin: 0; font-family: var(--serif); font-weight: 500; font-size: 26px; }
.empty-page p { margin: 8px 0 18px; color: var(--muted); font-size: 12px; }

/* ---------- modal & toast ---------- */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 120;
  display: grid; place-items: center; padding: 24px;
  background: rgba(23, 33, 28, .36); backdrop-filter: blur(5px);
  animation: fade .2s both;
}
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.modal {
  width: min(670px, 100%); max-height: 88vh; display: flex; flex-direction: column;
  background: var(--card); border: 1px solid var(--line-strong); border-radius: 14px;
  box-shadow: var(--shadow-lg); overflow: hidden;
  animation: modal-in .32s var(--ease) both;
}
@keyframes modal-in { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.modal-head h2 { margin: 0; font-family: var(--serif); font-size: 21px; font-weight: 600; }
.modal-head .sub { color: var(--muted); font-size: 10px; margin-left: 4px; }
.modal-close { margin-left: auto; }
.modal-body { padding: 20px; overflow: auto; }
.modal-foot { display: flex; align-items: center; gap: 8px; padding: 13px 20px; border-top: 1px solid var(--line); background: rgba(244, 239, 228, .5); }
.modal-foot .spacer { flex: 1; }
.modal-tabs { display: flex; gap: 4px; margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.modal-tab { border: 0; background: transparent; padding: 5px 9px; border-radius: 6px; color: var(--muted); font-size: 11px; }
.modal-tab.is-active { background: var(--jade-soft); color: var(--jade-dark); font-weight: 600; }
.form-section { margin-bottom: 22px; }
.form-section h3 { margin: 0 0 10px; color: var(--muted); font-size: 9px; letter-spacing: .16em; text-transform: uppercase; }
.toggle-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid rgba(218, 209, 192, .65); }
.toggle-row:last-child { border-bottom: 0; }
.toggle-row .text { flex: 1; }
.toggle-row strong { display: block; font-size: 12.5px; font-weight: 600; }
.toggle-row span { display: block; color: var(--muted); font-size: 10px; line-height: 1.55; margin-top: 2px; }
.switch { position: relative; width: 37px; height: 21px; flex: none; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.switch .track { position: absolute; inset: 0; border-radius: 999px; background: var(--line-strong); transition: .2s; pointer-events: none; }
.switch .track::after { content: ""; position: absolute; left: 3px; top: 3px; width: 15px; height: 15px; border-radius: 50%; background: var(--white); transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.switch input:checked + .track { background: var(--jade); }
.switch input:checked + .track::after { transform: translateX(16px); }
.key-status { display: flex; align-items: center; gap: 6px; margin-top: 8px; color: var(--muted); font-size: 10px; }
.key-status .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); }
.key-status.ok .dot { background: var(--jade); }
.inline-link { color: var(--jade); border-bottom: 1px solid rgba(20, 107, 88, .28); }
.inline-link:hover { border-bottom-color: var(--jade); }
.callout { display: flex; gap: 9px; padding: 11px 12px; border-radius: 8px; background: var(--jade-wash); color: var(--jade-dark); font-size: 10.5px; line-height: 1.65; }
.callout svg { width: 14px; height: 14px; flex: none; margin-top: 1px; }
.url-dialog .field { margin-bottom: 12px; }

.toast-root { position: fixed; right: 22px; bottom: 22px; z-index: 200; display: grid; gap: 8px; justify-items: end; pointer-events: none; }
.toast {
  pointer-events: auto; display: flex; align-items: center; gap: 9px;
  max-width: 380px; padding: 11px 15px;
  border: 1px solid var(--line-strong); border-radius: 9px;
  background: var(--ink); color: var(--paper-light); font-size: 11.5px; line-height: 1.5;
  box-shadow: 0 14px 35px rgba(23, 33, 28, .22);
  animation: toast-in .3s var(--ease) both;
}
.toast.error { background: #6e2c1f; border-color: #8d3b2b; }
.toast.success { background: var(--jade-dark); border-color: var(--jade); }
.toast svg { width: 14px; height: 14px; flex: none; }
.toast.is-out { animation: toast-out .25s both; }
@keyframes toast-in { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: none; } }
@keyframes toast-out { to { opacity: 0; transform: translateY(6px); } }

/* ---------- footer ---------- */
.site-footer { max-width: 1500px; margin: 0 auto; padding: 22px 34px 34px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 9.5px; }
.site-footer .spacer { flex: 1; }
.site-footer .seal { display: inline-flex; align-items: center; gap: 6px; }
.site-footer .seal i { width: 5px; height: 5px; border-radius: 50%; background: var(--coral); }

/* ---------- reading bar ---------- */
.reading-bar {
  display: flex; align-items: center; gap: 22px; flex-wrap: wrap;
  margin: 0 0 15px; padding: 0 2px;
  animation: page-in .4s both;
}
.reading-id { min-width: 0; }
.reading-id > span { display: block; color: var(--coral); font-family: var(--mono); font-size: 8px; letter-spacing: .15em; margin-bottom: 3px; }
.reading-id h2 { margin: 0; font-family: var(--serif); font-size: 23px; font-weight: 600; line-height: 1.3; letter-spacing: -.015em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.reading-badges { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.reading-badges .chip b { font-weight: 400; color: var(--coral); }
.reading-actions { margin-left: auto; display: flex; gap: 6px; }
body.has-article .hero { padding: 28px 0 22px; }
body.has-article .hero h1 { font-size: clamp(29px, 3.2vw, 42px); }
body.has-article .hero .lede { margin-top: 10px; font-size: 12.5px; max-width: 700px; }
body.has-article .hero-aside { display: none; }
body.has-article .hero-meta { margin-top: 13px; }

/* ---------- result footer & extras ---------- */
.result-foot {
  display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
  margin-top: 26px; padding-top: 13px; border-top: 1px solid var(--line);
  color: var(--muted); font-size: 9.5px;
}
.result-foot .chip { font-size: 8.5px; }
.result-foot-link { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; border: 0; background: transparent; color: var(--jade); font-size: 9.5px; font-weight: 600; }
.result-foot-link svg { width: 11px; height: 11px; }
.result-foot-link:hover { color: var(--jade-dark); }

.section-more { display: inline-flex; align-items: center; gap: 4px; color: var(--jade); font-size: 10.5px; font-weight: 600; margin-bottom: 8px; }
.section-more svg { width: 12px; height: 12px; }
.recent-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.recent-card {
  display: flex; flex-direction: column; align-items: flex-start; gap: 7px;
  padding: 16px 17px; border: 1px solid var(--line); border-radius: 10px;
  background: rgba(253, 250, 243, .58); text-align: left;
  transition: .2s var(--ease);
}
.recent-card:hover { transform: translateY(-2px); border-color: var(--line-strong); background: var(--card); box-shadow: var(--shadow-sm); }
.recent-top { width: 100%; display: flex; align-items: center; gap: 6px; }
.recent-time { margin-left: auto; color: var(--faint); font-size: 8.5px; }
.recent-card strong { font-family: var(--serif); font-size: 16px; font-weight: 600; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.recent-excerpt { color: var(--muted); font-size: 10.5px; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.recent-bottom { display: inline-flex; align-items: center; gap: 4px; margin-top: auto; color: var(--jade); font-size: 9px; font-weight: 600; }
.recent-bottom svg { width: 11px; height: 11px; }

/* ---------- grammar result view ---------- */
.grammar-result-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; color: var(--muted); font-size: 9.5px; }
.grammar-result-head span:last-child { margin-left: auto; color: var(--faint); }
.grammar-result-card { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 12px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.grc-index { padding-top: 3px; color: var(--faint); font-family: var(--mono); font-size: 9px; }
.grc-top { display: flex; align-items: center; gap: 5px; }
.grc-count { margin-left: auto; color: var(--faint); font-family: var(--mono); font-size: 8.5px; }
.grc-main h3 { margin: 6px 0 0; font-family: var(--serif); font-size: 20px; font-weight: 600; line-height: 1.3; }
.grc-main h3 a:hover { color: var(--jade); }
.grc-main h3 small { margin-left: 7px; color: var(--muted); font-family: var(--sans); font-size: 9.5px; font-weight: 400; }
.grc-summary { margin: 6px 0 8px; color: var(--ink-soft); font-size: 12px; line-height: 1.75; }
.grc-formula { display: inline-block; max-width: 100%; padding: 4px 8px; border-radius: 5px; background: var(--jade-wash); color: var(--jade-dark); font-family: var(--mono); font-size: 9px; line-height: 1.6; }
.grc-quote { margin: 8px 0 0; padding-left: 10px; border-left: 2px solid var(--line-strong); color: var(--muted); font-family: var(--serif); font-size: 11.5px; line-height: 1.7; font-style: italic; }
.grc-link { display: inline-flex; align-items: center; gap: 4px; margin-top: 9px; color: var(--jade); font-size: 9.5px; font-weight: 600; }
.grc-link svg { width: 11px; height: 11px; }

/* ---------- skeletons & filters ---------- */
.skeleton-card { min-height: 190px; pointer-events: none; }
.skeleton-card .skeleton-line { margin-bottom: 9px; }
.filter-count { margin-left: 4px; color: var(--faint); font-family: var(--mono); font-size: 8px; }
.filter-btn.is-active .filter-count { color: rgba(255,255,255,.65); }
.settings-tab-panel[hidden] { display: none; }
.modal-tabs + .settings-tab-panel { animation: page-in .25s both; }

@media (max-width: 860px) {
  .recent-grid { grid-template-columns: 1fr; }
  .reading-bar { gap: 10px; }
  .reading-actions { margin-left: 0; width: 100%; }
  body.has-article .hero .lede { display: none; }
}
@media (max-width: 580px) {
  .reading-id h2 { font-size: 19px; }
  .reading-badges .chip:nth-child(n+3) { display: none; }
  .grammar-result-card { grid-template-columns: 20px minmax(0, 1fr); gap: 8px; }
}

/* ---------- themes ---------- */
html { color-scheme: light; }
html[data-theme="night"] { color-scheme: dark; }
.theme-btn { color: var(--muted); }
.theme-btn:hover { color: var(--jade); background: var(--jade-wash); }
.theme-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
.theme-choice {
  display: flex; flex-direction: column; align-items: flex-start; gap: 3px;
  padding: 8px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--white); text-align: left; color: var(--ink);
  transition: border-color .18s, box-shadow .18s, transform .18s;
}
.theme-choice:hover { border-color: var(--line-strong); transform: translateY(-1px); }
.theme-choice.is-active { border-color: var(--jade); box-shadow: 0 0 0 2px rgba(20, 107, 88, .12); }
.theme-choice strong { font-size: 11.5px; }
.theme-choice small { color: var(--muted); font-size: 9px; line-height: 1.4; }
.theme-preview {
  display: block; width: 100%; height: 28px; border-radius: 5px;
  border: 1px solid rgba(0, 0, 0, .08); margin-bottom: 3px; position: relative; overflow: hidden;
}
.theme-preview::after { content: ""; position: absolute; left: 7px; top: 7px; width: 44%; height: 3px; border-radius: 2px; background: currentColor; opacity: .5; }
.theme-preview.paper { background: linear-gradient(135deg, #f4efe4 55%, #e7ddcb); color: #17211c; }
.theme-preview.night { background: linear-gradient(135deg, #101713 55%, #1d2b24); color: #d9d4c7; }
.theme-preview.clear { background: linear-gradient(135deg, #ffffff 55%, #edf3ef); color: #146b58; }

/* 暗夜 */
html[data-theme="night"] {
  --paper: #0f1512;
  --paper-deep: #1a231d;
  --paper-light: #18211b;
  --card: #141d17;
  --ink: #ebe5d7;
  --ink-soft: #b9b9ad;
  --muted: #8b958c;
  --faint: #5f6c62;
  --line: #2a362e;
  --line-strong: #3b4a40;
  --jade: #62b79e;
  --jade-dark: #91d6c1;
  --jade-soft: #1b332b;
  --jade-wash: #172820;
  --coral: #e27d64;
  --coral-dark: #f0a38d;
  --coral-soft: #3a231d;
  --gold: #d0aa68;
  --gold-soft: #332b1f;
  --white: #1a241d;
  --shadow-sm: 0 1px 0 rgba(0, 0, 0, .2), 0 4px 14px rgba(0, 0, 0, .18);
  --shadow-md: 0 2px 0 rgba(0, 0, 0, .18), 0 18px 48px rgba(0, 0, 0, .28);
  --shadow-lg: 0 32px 90px rgba(0, 0, 0, .55);
}
html[data-theme="night"] body {
  background:
    radial-gradient(1200px 600px at 8% -10%, rgba(98, 183, 158, .06), transparent 58%),
    radial-gradient(900px 700px at 100% 5%, rgba(226, 125, 100, .045), transparent 50%),
    var(--paper);
}
html[data-theme="night"] body::before {
  opacity: .12;
  background-image:
    linear-gradient(rgba(235, 229, 215, .06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(235, 229, 215, .06) 1px, transparent 1px);
}

/* 清透 */
html[data-theme="clear"] {

  --paper-deep: #edf3ef;
  --paper-light: #ffffff;
  --card: #ffffff;
  --ink: #112019;
  --ink-soft: #4b5a51;
  --muted: #78857d;
  --faint: #a6b1a9;
  --line: #e1e8e3;
  --line-strong: #c8d5cc;
  --jade: #0e725d;
  --jade-dark: #095744;
  --jade-soft: #e4f3ec;
  --jade-wash: #f0f8f4;
  --coral: #d65d43;
  --coral-dark: #a9432f;
  --coral-soft: #f8e6e1;
