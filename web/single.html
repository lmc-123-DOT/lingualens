/* ---------- compare reader ---------- */
.workspace-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1.12fr) 326px; }
.compare-page { padding-top: 6px; }
.compare-breadcrumb { display: flex; gap: 8px; align-items: center; padding: 18px 0 14px; color: var(--muted); font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; }
.compare-breadcrumb a { color: var(--jade); }
.compare-head { margin-bottom: 18px; }
.compare-title-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
.compare-title-row h1 { margin: 0 0 8px; font-family: var(--serif); font-size: clamp(27px, 3.4vw, 42px); line-height: 1.2; letter-spacing: -.04em; font-weight: 600; }
.compare-title-row p { margin: 0; color: var(--muted); font-size: 11.5px; }
.compare-title-row .arr { color: var(--coral); padding: 0 4px; }
.compare-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.compare-modes { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper-light); }
.compare-modes button { border: 0; background: transparent; padding: 5px 8px; border-radius: 4px; color: var(--muted); font-size: 9px; }
.compare-modes button.is-active { background: var(--coral); color: #fff; }
.cmp-sentence { padding-block: 8px; }
.cmp-sentence .cmp-text { font-size: calc(14.5px * var(--reading-scale, 1)); }
.compare-tip { display: flex; align-items: center; gap: 7px; margin-top: 14px; padding: 9px 12px; border: 1px dashed var(--line); border-radius: 7px; color: var(--muted); font-size: 10.5px; background: var(--jade-wash); }
.compare-tip svg { color: var(--coral); flex: none; }
.compare-loading { display: flex; align-items: center; gap: 10px; padding: 80px 20px; color: var(--muted); font-size: 12px; justify-content: center; }
.compare-columns {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  border: 1px solid var(--line-strong); border-radius: var(--radius);
  background: var(--card); overflow: clip; box-shadow: var(--shadow-md);
  min-height: 380px;
}
.cmp-col { min-width: 0; background: var(--card); }
.cmp-col + .cmp-col { border-left: 1px solid var(--line-strong); }
.cmp-col-head {
  position: sticky; top: 64px; z-index: 8;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  min-height: 48px; padding: 9px 16px; border-bottom: 1px solid var(--line);
  background: rgba(253, 250, 243, .94); backdrop-filter: blur(8px);
  color: var(--ink); font-size: 10px; font-weight: 700; letter-spacing: .15em;
}
html[data-theme="night"] .cmp-col-head { background: rgba(20, 29, 23, .94); }
html[data-theme="clear"] .cmp-col-head { background: rgba(255, 255, 255, .94); }
.cmp-lang { color: var(--faint); font-family: var(--mono); font-size: 8px; }
.cmp-stream { padding: 12px 18px 34px; }
.cmp-line {
  display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px;
  padding: 10px 8px 11px; border-bottom: 1px dashed rgba(218, 209, 192, .55);
  border-radius: 5px; transition: background .16s, box-shadow .16s;
}
.cmp-line:last-child { border-bottom: 0; }
.cmp-line:hover { background: rgba(20, 107, 88, .035); }
.cmp-line.is-target { background: var(--jade-soft); box-shadow: inset 3px 0 0 var(--jade); }
.cmp-no { color: var(--faint); font-family: var(--mono); font-size: 8px; padding-top: 5px; user-select: none; }
.cmp-text { margin: 0; color: var(--ink); font-family: var(--serif); font-size: calc(15px * var(--reading-scale, 1)); line-height: 1.92; }
.cmp-line h3.cmp-text { font-family: var(--sans); font-size: calc(19px * var(--reading-scale, 1)); line-height: 1.45; letter-spacing: -.02em; padding: 4px 0 2px; }
.cmp-line blockquote.cmp-text { padding-left: 14px; border-left: 2px solid var(--coral); color: var(--ink-soft); font-style: italic; }
.cmp-code pre { margin: 0; padding: 12px 14px; border-radius: 6px; background: #202823; color: #e8e2d5; font-family: var(--mono); font-size: 11.5px; line-height: 1.7; overflow: auto; white-space: pre-wrap; }
.cmp-left .cmp-text { color: var(--ink-soft); }
.cmp-right .cmp-text { color: var(--ink); }
.cmp-tabs { display: flex; align-items: center; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper-light); }
.cmp-tabs button { border: 0; background: transparent; padding: 5px 9px; border-radius: 4px; color: var(--muted); font-size: 9.5px; letter-spacing: .06em; }
.cmp-tabs button b { color: var(--coral); font-family: var(--mono); font-size: 8px; margin-left: 2px; }
.cmp-tabs button.is-active { background: var(--jade); color: #fff; }
.cmp-tabs button.is-active b { color: rgba(255,255,255,.8); }
.cmp-side-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; padding: 70px 24px; color: var(--muted); font-size: 11px; }
.cmp-side-empty p { max-width: 260px; margin: 0; line-height: 1.8; }
.glyph-sm { display: grid; place-items: center; width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 50%; color: var(--coral); font-family: var(--serif); font-size: 20px; }
.cmp-grammar-list { display: grid; gap: 8px; padding: 6px 0; }
.cmp-grammar-card { display: block; padding: 12px 13px; border: 1px solid var(--line); border-radius: 7px; background: var(--paper-light); transition: border-color .16s, transform .16s; }
.cmp-grammar-card:hover { border-color: var(--jade); transform: translateY(-1px); }
.cg-top { display: flex; justify-content: space-between; color: var(--muted); font-size: 8.5px; letter-spacing: .08em; }
.cg-cat { color: var(--coral); }
.cg-count { font-family: var(--mono); }
.cmp-grammar-card h4 { margin: 5px 0 4px; font-family: var(--serif); font-size: 15px; }
.cmp-grammar-card h4 small { display: block; margin-top: 2px; color: var(--muted); font-family: var(--sans); font-size: 9px; font-weight: 400; }
.cmp-grammar-card p { margin: 0; color: var(--ink-soft); font-size: 10.5px; line-height: 1.7; }
.cg-link { display: inline-flex; align-items: center; gap: 4px; margin-top: 7px; color: var(--jade); font-size: 9px; }
.cmp-word-list { display: grid; gap: 7px; padding: 6px 0; }
.cmp-word-card { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 8px; text-align: left; padding: 10px 11px; border: 1px solid var(--line); border-radius: 7px; background: var(--paper-light); color: var(--ink); }
.cmp-word-card:hover { border-color: var(--jade); }
.cw-word { font-family: var(--serif); font-size: 16px; }
.cw-phon { color: var(--muted); font-family: var(--mono); font-size: 9px; align-self: center; }
.cw-pos { justify-self: end; color: var(--jade); font-size: 8.5px; }
.cw-first { grid-column: 1 / -1; color: var(--ink-soft); font-size: 10.5px; line-height: 1.5; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* clickable words */
.word-token { cursor: pointer; border-radius: 3px; padding: 0 1px; transition: background .14s, color .14s, box-shadow .14s; }
.word-token:hover { background: var(--jade-wash); color: var(--jade-dark); box-shadow: 0 1px 0 var(--jade); }
.word-token.is-active { background: var(--jade-soft); color: var(--jade-dark); box-shadow: 0 0 0 2px var(--jade-soft); }
.word-token:focus-visible { outline: 2px solid var(--coral); outline-offset: 1px; }

/* word card */
.word-card {
  position: fixed; z-index: 90; width: min(330px, calc(100vw - 24px));
  max-height: min(420px, calc(100vh - 24px)); overflow: auto;
  padding: 13px 14px 11px; border: 1px solid var(--line-strong);
  border-radius: 10px; background: var(--card); box-shadow: var(--shadow-lg);
  animation: wc-in .16s ease-out;
}
.word-card[hidden] { display: none; }
.word-card::after {
  content: ""; position: absolute; left: var(--arrow-x, 50%); width: 9px; height: 9px;
  background: var(--card); border-right: 1px solid var(--line-strong); border-bottom: 1px solid var(--line-strong);
  transform: translateX(-50%) rotate(45deg); top: -6px;
}
.word-card.is-above::after { top: auto; bottom: -6px; transform: translateX(-50%) rotate(225deg); }
@keyframes wc-in { from { opacity: 0; transform: translateY(4px) scale(.985); } to { opacity: 1; transform: none; } }
.wc-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.wc-title { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; }
.wc-word { font-family: var(--serif); font-size: 23px; line-height: 1.2; color: var(--ink); letter-spacing: -.02em; }
.wc-phon { color: var(--muted); font-family: var(--mono); font-size: 9.5px; }
.wc-close { border: 0; background: transparent; color: var(--faint); padding: 2px; border-radius: 4px; }
.wc-close:hover { color: var(--coral); background: var(--coral-soft); }
.wc-pos-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
.wc-chip { padding: 2px 6px; border-radius: 4px; background: var(--jade-wash); color: var(--jade-dark); font-size: 8.5px; }
.wc-meanings { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 7px; }
.wc-meanings li { display: grid; grid-template-columns: 15px auto minmax(0, 1fr); gap: 5px; align-items: baseline; }
.wc-index { display: grid; place-items: center; width: 14px; height: 14px; border-radius: 50%; background: var(--paper-deep); color: var(--muted); font-family: var(--mono); font-size: 7.5px; }
.wc-meanings .wc-pos { justify-self: start; color: var(--coral); font-size: 8px; white-space: nowrap; }
.wc-mean { color: var(--ink); font-size: 11.5px; line-height: 1.6; }
.wc-save { margin-top: 8px; padding: 5px 8px; border: 1px solid var(--jade); border-radius: 4px; background: var(--jade-wash); color: var(--jade-dark); font-size: 9px; }
.wc-save:hover { background: var(--jade); color: #fff; }
.wc-morph { margin-top: 10px; padding: 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--jade-wash); }
.wc-morph-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.wc-morph-head span { color: var(--jade-dark); font-size: 8px; letter-spacing: .12em; }
.wc-morph-head b { padding: 2px 6px; border-radius: 3px; background: var(--jade); color: #fff; font-size: 8.5px; font-weight: 500; }
.wc-form-pair { display: grid; grid-template-columns: 1fr 18px 1fr; align-items: center; gap: 4px; margin-top: 8px; }
.wc-form-pair > div { padding: 6px 7px; border: 1px solid var(--line); border-radius: 4px; background: var(--card); }
.wc-form-pair small { display: block; color: var(--faint); font-size: 7.5px; }
.wc-form-pair strong { display: block; margin-top: 1px; color: var(--ink); font-family: var(--serif); font-size: 14px; font-weight: 500; word-break: break-word; }
.wc-arrow { display: grid; place-items: center; color: var(--coral); }
.wc-change { margin-top: 6px; color: var(--coral-dark); font-family: var(--mono); font-size: 8.5px; }
.wc-form-tags { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 6px; }
.wc-form-tags span { padding: 1px 5px; border: 1px solid var(--line); border-radius: 3px; color: var(--muted); font-size: 7.5px; }
.wc-morph-explain { margin: 6px 0 0; color: var(--ink-soft); font-size: 9.5px; line-height: 1.6; }
.wc-context { margin-top: 10px; padding: 8px 9px; border-left: 2px solid var(--coral); background: var(--coral-soft); border-radius: 0 5px 5px 0; }
.wc-context span { color: var(--coral-dark); font-size: 8px; letter-spacing: .1em; }
.wc-context p { margin: 3px 0 0; color: var(--ink-soft); font-family: var(--serif); font-size: 10.5px; line-height: 1.6; }
.wc-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
.wc-source { color: var(--faint); font-size: 8px; }
.wc-actions { display: flex; gap: 3px; }
.wc-icon { display: grid; place-items: center; width: 25px; height: 25px; border: 1px solid var(--line); border-radius: 5px; background: var(--paper-light); color: var(--ink-soft); }
.wc-icon:hover { color: var(--jade); border-color: var(--jade); }
.wc-loading { display: flex; align-items: center; gap: 8px; padding: 22px 4px; color: var(--muted); font-size: 10.5px; }
.wc-error { padding: 14px 2px 6px; color: var(--coral-dark); font-size: 11px; line-height: 1.7; }
.wc-error span { color: var(--muted); font-size: 9.5px; }
html[data-theme="night"] .cmp-line:hover { background: rgba(98, 183, 158, .045); }

/* ---------- article breakdown ---------- */

  // ---------------------------------------------------------------- api
  async function api(path, options = {}) {
    const { method = 'GET', body, timeout = 240000 } = options;
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeout);
    try {
      const res = await fetch(path, {
        method,
        headers: body ? { 'Content-Type': 'application/json' } : undefined,
        body: body ? JSON.stringify(body) : undefined,
        signal: controller.signal,
      });
      const text = await res.text();
      let data = {};
      try { data = text ? JSON.parse(text) : {}; } catch { throw new Error(`服务器返回了非 JSON 内容（${res.status}）`); }
      if (!res.ok || data.ok === false) throw new Error(data.error || `请求失败（${res.status}）`);
      return data;
    } catch (err) {
      if (err.name === 'AbortError') throw new Error('请求超时，请稍后重试');
      throw err;
    } finally {
      clearTimeout(timer);
    }
  }

  function toast(message, type = '') {
    const root = $('#toast-root');
    if (!root) return;
    const node = document.createElement('div');
    node.className = `toast ${type}`;
    node.innerHTML = `${icon(type === 'error' ? 'alert' : type === 'success' ? 'check' : 'spark', 14)}<span>${esc(message)}</span>`;
    root.appendChild(node);
    setTimeout(() => {
      node.classList.add('is-out');
      setTimeout(() => node.remove(), 280);
    }, type === 'error' ? 5200 : 3400);
  }

    return `${(bytes / 1024 / 1024).toFixed(1)} MB`;

    if (!iso) return '';
    const d = new Date(iso);

    return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())}`;
  };
  const timeAgo = (iso) => {
    if (!iso) return '';
    const d = new Date(iso);

    if (diff < 60) return '刚刚';

    if (diff < 86400) return `${Math.floor(diff / 3600)} 小时前`;

      <div class="hero-aside" aria-hidden="true">
        <div class="hero-metrics">
          <div class="hero-metric"><strong>${fmtNumber(total)}</strong><span>语法条目</span></div>
          <div class="hero-metric"><strong>${grammarLangCount}</strong><span>语法语言</span></div>
          <div class="hero-metric"><strong>${langCount}</strong><span>翻译语言</span></div>
        </div>
      </div>
    </section>`;
  }

  function readingBarHTML(article) {
    if (!article) return '';
    const src = article.source || {};
    const tgt = article.target || {};
    const grammarCount = article.grammar?.summary?.total || 0;
    return `<div class="reading-bar">
      <div class="reading-id">
        <span>NOW READING · ${esc(fmtDate(article.createdAt))}</span>
        <h2>${esc(article.title || '未命名文章')}</h2>
      </div>
      <div class="reading-badges">
        <span class="chip">${esc(src.label || lang(src.lang).name)} <b>→</b> ${esc(tgt.label || lang(tgt.lang).name)}</span>
        <span class="chip">${fmtNumber(src.stats?.words)} 词</span>
        <span class="chip jade">${grammarCount} 个语法点</span>
        <span class="chip outline">${esc(tgt.cached ? '翻译记忆' : providerLabel(tgt.provider))}</span>
      </div>
      <div class="reading-actions">
        <a class="btn btn-sm btn-ghost" href="/compare" data-link>${icon('columns', 13)} 对照阅读</a>
        <button class="btn btn-sm btn-ghost" data-action="copy-translation">${icon('copy', 13)} 复制译文</button>
        <button class="btn btn-sm btn-ghost" data-action="download-word">${icon('file', 13)} Word</button>
        <button class="btn btn-sm btn-ghost" data-action="download-article">${icon('download', 13)} 导出</button>
      </div>
    </div>`;
  }

  function langOption(code, selected) {
    const meta = code === 'auto' ? { name: '自动检测', native: 'Auto' } : lang(code);
    return `<option value="${code}" ${selected === code ? 'selected' : ''}>${esc(`${meta.name} · ${meta.native}`)}</option>`;
  }
  function sourceLangOptions(selected) {
    return sourceLangs.map((code) => langOption(code, selected)).join('');
  }
  function targetLangOptions(selected) {
    const primary = ['zh-CN', 'zh-TW', 'en', 'ja', 'ko', 'fr', 'de', 'es', 'ru'];
    const more = targetLangs.filter((code) => !primary.includes(code));
    return `<optgroup label="常用语言">${primary.map((code) => langOption(code, selected)).join('')}</optgroup>
      <optgroup label="更多高频语言">${more.map((code) => langOption(code, selected)).join('')}</optgroup>`;
  }
  function providerOptions(selected) {
    const list = state.providers.length ? state.providers : [
      { id: 'auto', label: '自动优选', available: true, note: '' },
      { id: 'ai', label: 'AI 精准模式', available: false, note: '先在设置中填入 API Key' },
      { id: 'mymemory', label: 'MyMemory 免费引擎', available: true, note: '' },
      { id: 'google', label: 'Google 免费引擎', available: true, note: '' },
    ];
    return list.map((p) => `<option value="${p.id}" ${selected === p.id ? 'selected' : ''} ${p.available === false ? 'disabled' : ''}>${esc(p.label)}${p.available === false ? '（需配置）' : ''}</option>`).join('');
  }

  function studioHTML() {
    const article = state.article;
    const sourceText = state.draftSource !== undefined && state.draftSource !== null && state.draftSource !== ''
      ? state.draftSource
      : (article?.source?.text || '');
    const stats = article?.source?.stats;
    const loading = state.loading;
    return `<section class="studio" id="studio">
      <div class="studio-toolbar">
        <div class="lang-group">
          <div class="select-wrap select-sm"><label class="sr-only" for="source-lang">原文语言</label><select id="source-lang">${sourceLangOptions(state.sourceLang)}</select></div>
          <button class="swap-btn" data-action="swap-langs" title="交换语言" aria-label="交换语言">${icon('swap', 14)}</button>
          <div class="select-wrap select-sm"><label class="sr-only" for="target-lang">目标语言</label><select id="target-lang">${targetLangOptions(state.targetLang)}</select></div>
        </div>
        <div class="select-wrap provider-select">
          <label class="sr-only" for="provider-select">翻译引擎</label>

        </div>
        <span class="toolbar-spacer"></span>
        <button class="btn btn-primary" data-action="translate" ${loading ? 'disabled' : ''}>
          ${loading ? `<span class="spinner" style="border-color:rgba(255,255,255,.35);border-top-color:#fff"></span> 翻译中` : `${icon('spark', 15)} 开始翻译 <span class="kbd">${MOD_KEY} ↵</span>`}
        </button>
      </div>
      <div class="workspace-grid">
        <section class="pane source-pane" aria-label="原文输入">
          <div class="pane-head">
            <div class="pane-title"><span class="ord">01</span> 原文 <span class="count" id="source-count">${stats ? `${fmtNumber(stats.words)} 词 · ${fmtNumber(stats.chars)} 字` : '等待输入'}</span></div>
            <div class="pane-tools">
              <span class="dirty-flag">${icon('alert', 12)} 有改动</span>
              <button class="icon-btn" data-action="clear" title="清空" aria-label="清空">${icon('trash', 15)}</button>
            </div>
          </div>
          <div class="pane-body source-area-wrap">
            <textarea id="source-text" spellcheck="false" placeholder="粘贴一篇文章，或拖入 TXT / Markdown / Word / PDF / EPUB 文件…">${esc(sourceText)}</textarea>
            <div class="drop-overlay" id="drop-overlay">${icon('upload', 28)}<strong>松手，交给语镜</strong><span>支持 PDF、Word、EPUB、Markdown、字幕等 11 种格式</span></div>
            <div class="source-foot">
              <button class="btn btn-sm" data-action="upload">${icon('upload', 13)} 导入文件</button>
              <button class="btn btn-sm" data-action="open-url">${icon('link', 13)} 网页链接</button>
              <button class="btn btn-sm" data-action="load-sample" data-sample="en">${icon('book', 13)} 示例</button>
              <span class="meta" id="source-meta">${stats ? `${fmtNumber(stats.paragraphs)} 段 · 约 ${stats.minutes} 分钟` : 'Ctrl / ⌘ + Enter 翻译'}</span>
            </div>
          </div>
        </section>

        <section class="pane result-pane" aria-label="翻译结果" style="--reading-scale:${state.readingScale}">
          <div class="pane-head">
            <div class="pane-title"><span class="ord">02</span> 译文</div>
            <div class="pane-tools">
              <a class="btn btn-sm btn-ghost" href="/compare" data-link>${icon('columns', 13)} 对照阅读</a>
              <div class="font-controls" title="阅读字号">
                <button data-action="font-smaller" aria-label="缩小字号">A−</button>
                <span id="font-value">${Math.round(state.readingScale * 100)}%</span>
                <button data-action="font-larger" aria-label="放大字号">A+</button>
              </div>
              <button class="icon-btn" data-action="copy-translation" title="复制译文" aria-label="复制译文" ${article ? '' : 'disabled'}>${icon('copy', 15)}</button>
              <button class="icon-btn" data-action="download-article" title="导出 Markdown" aria-label="导出" ${article ? '' : 'disabled'}>${icon('download', 15)}</button>
            </div>
          </div>
          <div class="result-body" id="result-body">${resultBodyHTML()}</div>
        </section>
        <aside class="grammar-rail" aria-label="文章语法雷达">${railHTML()}</aside>
      </div>
    </section>`;
  }

  function workspaceHTML() {
    return `${heroHTML()}${readingBarHTML(state.article)}${studioHTML()}
      ${featuresHTML()}
      <div id="recent-strip"></div>`;
  }

  function featuresHTML() {
    return `<div class="section-head"><h2>一张纸，四件事</h2><p>翻译、对照、语法、批译，彼此连着</p><span class="line"></span></div>
      <section class="features">
        <article class="feature"><span class="no">01 / IMPORT</span><span class="icon">${icon('upload', 17)}</span><h3>多格式进入</h3><p>PDF、Word、PPT、Excel、EPUB、网页、字幕，拖进来就排版。</p></article>
        <article class="feature"><span class="no">02 / TRANSLATE</span><span class="icon">${icon('braille', 17)}</span><h3>逐段精准翻译</h3><p>保留段落编号与标题层级，译文和原文一一对应，不漏段。</p></article>
        <article class="feature"><span class="no">03 / GRAMMAR</span><span class="icon">${icon('layers', 17)}</span><h3>语法雷达</h3><p>从文中定位时态、助词、句式，点开就是一整页讲解。</p></article>
        <article class="feature"><span class="no">04 / FOLDER</span><span class="icon">${icon('folder', 17)}</span><h3>整夹批译</h3><p>选一个文件夹，递归翻译并输出双语 Markdown。</p></article>
      </section>`;
  }

  function resultBodyHTML() {
    if (state.loading) {
      return `<div class="loading-state">
        <div class="loading-note"><span class="spinner"></span><span id="loading-note-text">正在切分段落，逐段翻译…</span></div>
        <div class="skeleton-line title"></div>
        <div class="skeleton-line"></div><div class="skeleton-line"></div><div class="skeleton-line"></div>
        <div class="skeleton-line title" style="width:38%;margin-top:16px"></div>
        <div class="skeleton-line"></div><div class="skeleton-line"></div>
        <div class="skeleton-line"></div><div class="skeleton-line"></div>
      </div>`;
    }
    if (!state.article) {
      return `<div class="empty-state">
        <div class="empty-glyph">译</div>
        <h3>译文会在这里展开</h3>
        <p>左边放入文章，或从一份示例开始。翻译完成后点「对照阅读」，进入独立的左右对照页。</p>
        <div class="empty-actions">
          <button class="btn btn-sm btn-primary" data-action="load-sample" data-sample="en">英文示例</button>
          <button class="btn btn-sm" data-action="load-sample" data-sample="ja">日文示例</button>
          <button class="btn btn-sm" data-action="load-sample" data-sample="zh">中文示例</button>
        </div>
      </div>`;
    }
    const article = state.article;
    const warnings = (article.warnings || []).map((w) => `<div class="warning-item">${icon('alert', 13)}<span>${esc(w)}</span></div>`).join('');
    let body = '';
    if (state.view === 'grammar') body = grammarResultHTML(article);
    else if (state.view === 'bilingual') body = bilingualHTML(article);
    else body = translatedHTML(article);
    const tgt = article.target || {};
    return `${warnings ? `<div class="warning-list">${warnings}</div>` : ''}
      ${body}
      <div class="result-foot">
        <span>${esc(tgt.cached ? '翻译记忆命中' : (tgt.providerLabel || providerLabel(tgt.provider)))} · ${(tgt.blocks || []).length} 段 · ${esc(String(article.elapsed || '—'))}s</span>
        ${tgt.cached ? `<span class="chip">命中缓存 ${tgt.cached} 段</span>` : ''}
        <button class="result-foot-link" data-action="open-grammar-index">语法全图 ${icon('arrow', 11)}</button>
      </div>`;
  }

  function articleBlocks(article) {
    return article.target?.blocks || [];
  }

  function translatedHTML(article) {
    const blocks = articleBlocks(article);
    if (!blocks.length) return `<div class="empty-state"><p>译文为空。</p></div>`;
    let html = '<article class="article-prose">';
    let inList = false;
    for (const block of blocks) {
      if (block.type === 'list') {
        if (!inList) { html += '<ul class="art-list">'; inList = true; }
        html += `<li id="block-${block.id}" data-block="${block.id}">${esc(block.target)}</li>`;
        continue;
      }
      if (inList) { html += '</ul>'; inList = false; }
      const text = esc(block.target).replace(/\n/g, '<br>');
      if (block.type === 'heading') {
        const level = Math.min(4, Math.max(1, Number(block.level) || 2));
        html += `<h${level} class="art-h${level}" id="block-${block.id}" data-block="${block.id}">${text}</h${level}>`;
      } else if (block.type === 'quote') {
        html += `<blockquote id="block-${block.id}" data-block="${block.id}">${text}</blockquote>`;
      } else if (block.type === 'code') {
        html += `<pre class="art-code" id="block-${block.id}" data-block="${block.id}">${esc(block.source)}</pre>`;
      } else if (block.type === 'table') {
        html += `<div class="art-table" id="block-${block.id}" data-block="${block.id}"><pre>${esc(block.source)}</pre></div>`;
      } else {
        html += `<p class="art-p" id="block-${block.id}" data-block="${block.id}">${text}</p>`;
      }
    }
    if (inList) html += '</ul>';
    html += '</article>';
    return html;
  }

  function grammarByBlock(article) {
    const map = {};
    for (const point of article.grammar?.points || []) {
      for (const occ of point.occurrences || []) {
        const key = String(occ.blockId || 0);
        if (!map[key]) map[key] = [];
        if (!map[key].some((p) => p.id === point.id)) map[key].push(point);
      }
    }
    return map;
  }

  function bilingualHTML(article) {
    const blocks = articleBlocks(article);
    if (!blocks.length) return `<div class="empty-state"><p>没有可对照的段落。</p></div>`;
    const byBlock = grammarByBlock(article);
    return `<div class="bilingual-list">${blocks.map((b) => {
      const chips = (byBlock[String(b.id)] || []).slice(0, 3).map((p) =>
        `<a class="chip jade" href="/grammar/${encodeURIComponent(p.id)}?from=${encodeURIComponent(article.id)}" data-link>${esc(p.title)}</a>`).join('');
      return `<div class="bi-row ${b.type === 'heading' ? 'is-heading' : ''} ${b.type === 'code' || b.type === 'table' ? 'is-code' : ''}" id="block-${b.id}" data-block="${b.id}">
        <div class="bi-num">${pad(Number(b.id) || 0)}</div>
        <div class="bi-source">${esc(b.source).replace(/\n/g, '<br>')}</div>
        <div class="bi-target">${esc(b.target).replace(/\n/g, '<br>')}${chips ? `<div class="bi-chips">${chips}</div>` : ''}</div>
      </div>`;
    }).join('')}</div>`;
  }

  function grammarResultHTML(article) {
    const points = article.grammar?.points || [];
    if (!points.length) {
      return `<div class="empty-state"><div class="empty-glyph">法</div><h3>这篇文章没有命中语法规则</h3><p>可能是文本太短，或属于尚未建立规则的语言。你仍然可以在「对照阅读」中逐段阅读。</p></div>`;
    }
    return `<div class="grammar-result-list">
      <div class="grammar-result-head"><span>${points.length} 个语法点</span><span>按出现次数排序</span></div>
      ${points.map((p, index) => `<article class="grammar-result-card">
        <div class="grc-index">${pad(index + 1)}</div>
        <div class="grc-main">
          <div class="grc-top"><span class="chip">${esc(p.category)}</span><span class="chip gold">${esc(p.cefr)}</span><span class="grc-count">${p.count} 处</span></div>
          <h3><a href="/grammar/${encodeURIComponent(p.id)}?from=${encodeURIComponent(article.id)}" data-link>${esc(p.title)}</a><small>${esc(p.english)}</small></h3>
          <p class="grc-summary">${esc(p.summary)}</p>
          <div class="grc-formula">${esc(p.formula)}</div>
          ${(p.occurrences || []).slice(0, 2).map((o) => `<blockquote class="grc-quote">${esc(o.sentence)}</blockquote>`).join('')}
          <a class="grc-link" href="/grammar/${encodeURIComponent(p.id)}?from=${encodeURIComponent(article.id)}" data-link>查看完整讲解 ${icon('arrow', 12)}</a>
        </div>
      </article>`).join('')}
    </div>`;
  }

  function highlightMatch(sentence, match) {
    const text = String(sentence || '');
    const needle = String(match || '');
    if (!needle) return esc(text);
    const index = text.toLowerCase().indexOf(needle.toLowerCase());
    if (index < 0) return esc(text);
    return `${esc(text.slice(0, index))}<mark>${esc(text.slice(index, index + needle.length))}</mark>${esc(text.slice(index + needle.length))}`;
  }

  function grammarMiniHTML(p, article) {
    const occurrence = (p.occurrences || [])[0];
    return `<a class="grammar-mini" href="/grammar/${encodeURIComponent(p.id)}?from=${encodeURIComponent(article?.id || '')}" data-link>
      <div class="grammar-mini-top"><span class="chip outline">${esc(p.cefr)}</span><span class="cat">${esc(p.category)}</span><span class="times">${p.count} 处</span></div>
      <h4>${esc(p.title)}<small>${esc(p.english)}</small></h4>
      <p class="formula">${esc(p.formula)}</p>
      ${p.summary ? `<p class="grammar-mini-summary">${esc(p.summary)}</p>` : ''}
      ${occurrence ? `<blockquote class="grammar-mini-quote">${highlightMatch(occurrence.sentence, occurrence.match)}</blockquote>` : ''}
      <span class="open-hint">完整讲解 ${icon('arrow', 11)}</span>
    </a>`;
  }

  function railHTML() {
    const article = state.article;
    const points = article?.grammar?.points || [];
    const count = points.length;
    const categories = article?.grammar?.summary?.categories || {};
    const catList = Object.entries(categories).sort((a, b) => b[1] - a[1]).slice(0, 5);
    const totalCat = catList.reduce((s, [, n]) => s + n, 0) || 1;
    const bars = catList.map(([, n]) => `<span style="width:${Math.max(4, (n / totalCat) * 100)}%"></span>`).join('');
    const list = points.length
      ? points.map((p) => grammarMiniHTML(p, article)).join('')
      : `<div class="rail-empty"><div class="seal">法</div><p>翻译完成后，这里会出现文章里的语法点。<br>每一个都能点开完整讲解。</p></div>`;
    return `<div class="rail-head">
        <div class="rail-title"><h3>语法雷达</h3><span class="count-badge">${count}</span></div>
        <p class="rail-sub">${count ? `${points.reduce((s, p) => s + (p.count || 0), 0)} 处命中 · 点击卡片看完整讲解` : '等待一篇文章'}</p>
        <div class="rail-stats">${bars}</div>
        ${count ? `<button class="rail-report" data-action="open-grammar-report">${icon('layers', 12)} 语法雷达详细报告</button>` : ''}
      </div>
      <div class="rail-scroll">${list}</div>
      <div class="rail-foot"><button class="btn btn-sm" data-action="open-grammar-index">${icon('layers', 13)} 打开完整语法图谱 ${icon('arrow', 11)}</button></div>`;
  }

  function openGrammarReport() {
    const article = state.article;
    const points = article?.grammar?.points || [];
    if (!points.length) { toast('还没有识别到语法点。', 'error'); return; }
    const groups = {};
    for (const point of points) (groups[point.category] ||= []).push(point);
    const summary = article.grammar?.summary || {};
    openModal(`<div class="modal-head"><h2>语法雷达详细报告</h2><span class="sub">${points.length} 类 · ${summary.total || 0} 处</span><button class="icon-btn modal-close" data-action="close-modal">${icon('x', 16)}</button></div>
      <div class="modal-body grammar-report">
        <div class="report-summary">${Object.entries(summary.categories || {}).sort((a, b) => b[1] - a[1]).map(([cat, n]) => `<span><b>${esc(cat)}</b>${n}</span>`).join('')}</div>
        ${Object.entries(groups).map(([category, items]) => `<section class="report-group"><h3>${esc(category)}<small>${items.length} 类</small></h3>${items.map((p) => grammarMiniHTML(p, article)).join('')}</section>`).join('')}
        <p class="report-note">雷达按规则和已配置的 AI 语法增强生成；复杂句可能有遗漏，可点进单条讲解核对。</p>
      </div>`);
  }

  function afterWorkspace() {
    const textarea = $('#source-text');
    if (textarea && state.loading) textarea.setAttribute('readonly', 'readonly');
    if (state.loading) {
      let i = 0;
      const notes = ['正在切分段落，逐段翻译…', '正在对齐原文与译文…', '正在扫描时态、助词与句式…', '还在处理长句，请稍候…'];
      clearTimeout(state.loadingTimer);
      state.loadingTimer = setInterval(() => {
        const node = $('#loading-note-text');
        if (!node) return;
        i = (i + 1) % notes.length;
        node.textContent = notes[i];
      }, 2600);
    }
    if (state.scrollBlock) {
      const target = $(`#block-${state.scrollBlock}`);
      if (target) setTimeout(() => target.scrollIntoView({ block: 'center', behavior: 'smooth' }), 120);
      state.scrollBlock = null;
    }
    if (!state.article) loadRecentStrip();
    // Textarea counters
    if (textarea) {
      textarea.addEventListener('input', onSourceInput);
    }
  }

  function onSourceInput(e) {
    state.draftSource = e.target.value;
    document.querySelector('.source-pane')?.classList.add('is-dirty');
    const stats = roughStats(e.target.value);
    const count = $('#source-count');
    const meta = $('#source-meta');
    if (count) count.textContent = stats.words ? `${fmtNumber(stats.words)} 词 · ${fmtNumber(stats.chars)} 字` : '等待输入';
    if (meta) meta.textContent = stats.words ? `${fmtNumber(stats.paragraphs)} 段 · 约 ${stats.minutes} 分钟` : 'Ctrl / ⌘ + Enter 翻译';
  }

  function roughStats(text) {
    const latin = (text.match(/[A-Za-zÀ-ÖØ-öø-ÿ]+(?:['’\-][A-Za-zÀ-ÖØ-öø-ÿ]+)*/g) || []).length;
    const cjk = (text.match(/[\u3040-\u30ff\u3400-\u9fff\uac00-\ud7a3]/g) || []).length;
    const chars = text.replace(/\s/g, '').length;
    return { words: latin + cjk, chars, paragraphs: text.split(/\n\s*\n/).filter((p) => p.trim()).length, minutes: Math.max(1, Math.round((latin + cjk) / 260)) || 0 };
  }

  async function loadRecentStrip() {
    try {
      const data = await api('/api/history?limit=3');
      const items = data.items || [];
      const container = $('#recent-strip');
      if (!container || !items.length) return;
      container.innerHTML = `<div class="section-head"><h2>最近的纸页</h2><p>从上次读到的地方继续</p><span class="line"></span><a href="/history" data-link class="section-more">全部历史 ${icon('arrow', 12)}</a></div>
        <div class="recent-grid">${items.map((item) => `<button class="recent-card" data-open-history="${attr(item.id)}">
          <span class="recent-top"><span class="chip">${esc(lang(item.sourceLang).short)} → ${esc(lang(item.targetLang).short)}</span><span class="recent-time">${esc(timeAgo(item.createdAt))}</span></span>

  function readControls() {
    const source = $('#source-lang');
    const target = $('#target-lang');
    const provider = $('#provider-select');
    if (source) state.sourceLang = source.value;
    if (target) state.targetLang = target.value;
    if (provider) state.provider = provider.value;
    persistPrefs();
  }

  function persistPrefs() {
    try {
      localStorage.setItem('ll.prefs', JSON.stringify({
        sourceLang: state.sourceLang, targetLang: state.targetLang, provider: state.provider, view: state.view,
      }));
    } catch { /* private mode */ }
  }

  async function doTranslate() {
    const textarea = $('#source-text');
    const text = (textarea ? textarea.value : state.draftSource || '').trim();
    if (!text) { toast('先放入一篇文章，或载入示例。', 'error'); textarea?.focus(); return; }
    readControls();
    if (text.length > 160000) { toast('文章太长，请控制在 16 万字符以内。', 'error'); return; }
    state.draftSource = text;
    if (state.article && state.article.source?.text !== text) state.article = null;
    state.loading = true;
    state.view = 'translation';
    renderRoute();
    try {
      const data = await api('/api/translate', {
        method: 'POST',
        body: { text, source: state.sourceLang, target: state.targetLang, provider: state.provider },
      });
      state.article = data.article;
      state.draftSource = data.article.source.text;
      state.loading = false;
      try { sessionStorage.setItem('ll.article', JSON.stringify(data.article)); } catch { /* quota */ }
      renderRoute();
      const warnings = data.article.warnings || [];
      if (data.article.target?.provider === 'offline') toast('在线引擎不可用，当前是离线预览。', 'error');
      else if (warnings.length) toast(warnings[0], 'error');
      else toast(`翻译完成 · ${data.article.grammar?.summary?.total || 0} 个语法点已定位`, 'success');
    } catch (err) {
      state.loading = false;
      renderRoute();
      toast(err.message || '翻译失败', 'error');
    }
  }

  // ---------------------------------------------------------------- file / URL import
  function pickFile() {
    const input = $('#file-input');
    if (!input) return;
    input.value = '';
    input.click();
  }

  async function handleFile(file) {
    if (!file) return;
    if (file.size > 40 * 1024 * 1024) { toast('文件超过 40MB，请拆分后再导入。', 'error'); return; }
    state.importing = true;
    toast(`正在解析 ${file.name}…`);
    try {
      const dataUrl = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error('读取文件失败'));
        reader.readAsDataURL(file);
      });
      const data = await api('/api/extract', { method: 'POST', body: { filename: file.name, data: dataUrl } });
      state.article = null;
      state.draftSource = data.text;
      state.sourceLang = 'auto';
      state.view = 'translation';
      toast(`已导入 ${data.meta?.formatLabel || file.name} · ${fmtNumber(data.stats?.chars)} 字`, 'success');
      renderRoute();
      setTimeout(doTranslate, 120);
    } catch (err) {
      toast(err.message || '文件解析失败', 'error');
    } finally {
      state.importing = false;
    }
  }

          <div class="callout">${icon('shield', 14)}<span>抓取只发生在你的电脑上。内网地址与本地文件不会被访问。</span></div>

  function downloadArticle() {
    const article = state.article;
    if (!article) { toast('还没有可导出的译文。', 'error'); return; }
    if (article.id && !article.id.startsWith('art-temp')) {
      window.location.href = `/api/history/${encodeURIComponent(article.id)}/export?format=md`;
      return;
    }
    const blob = new Blob([`# ${article.title}\n\n## 译文\n\n${article.target.text}\n\n---\n\n## 原文\n\n${article.source.text}\n`], { type: 'text/markdown;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${article.title || 'lingualens'}.md`; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function downloadWord() {
    const article = state.article;
    if (!article?.id) { toast('还没有可导出的译文。', 'error'); return; }
    window.location.href = `/api/history/${encodeURIComponent(article.id)}/export?format=docx`;

  function langTag(code) {
    const value = String(code || '').toLowerCase();
    if (value.startsWith('zh')) return 'zh-Hans';
    if (value === 'ja') return 'ja';
    if (value === 'ko') return 'ko';
    if (value === 'fr') return 'fr';
    if (value === 'de') return 'de';
    if (value === 'es') return 'es';
    if (value === 'ru') return 'ru';
    return 'en';
  }

  function tokenizeHTML(text, lang) {
    const raw = String(text || '');
    if (!raw) return '';
    let segmenter = null;
    try { segmenter = new Intl.Segmenter(langTag(lang), { granularity: 'word' }); } catch { /* older browser */ }
    if (!segmenter) {
      return esc(raw).replace(/([A-Za-z][A-Za-z'’-]*|[\u3400-\u9fff\u3040-\u30ff]+)/g, (word) => `<span class="word-token" data-word="${attr(word)}" data-lang="${attr(lang)}">${esc(word)}</span>`);
    }
    let result = '';
    for (const part of segmenter.segment(raw)) {
      const value = part.segment;
      if (!value) continue;
      if (part.isWordLike && value.length <= 64) {
        result += `<span class="word-token" data-word="${attr(value)}" data-lang="${attr(lang)}" tabindex="0" role="button">${esc(value)}</span>`;
      } else {
        result += esc(value).replace(/\n/g, '<br>');
      }
    }
    return result;
  }

  function splitSentencesText(text) {
    const clean = String(text || '').replace(/\s+/g, ' ').trim();
    if (!clean) return [];
    const pieces = clean.split(/(?<=[。！？!?])\s*|(?<=[.])\s+(?=[A-Z"「『“])/);
    return pieces.map((piece) => piece.trim()).filter(Boolean);
  }

  function comparePairs(article) {
    const pairs = [];
    for (const block of (article.target?.blocks || [])) {
      if (block.type === 'code') continue;
      const sources = splitSentencesText(block.source);
      const targets = splitSentencesText(block.target);
      const total = Math.max(sources.length, targets.length);
      for (let index = 0; index < total; index += 1) {
        pairs.push({
          id: `${block.id || pairs.length}-${index}`,
          type: block.type || 'paragraph',
          source: sources[index] || (index === 0 ? block.source : ''),
          target: targets[index] || (index === 0 ? block.target : ''),
        });
      }
    }
    return pairs;
  }

  function compareStreamHTML(article, side) {
    if (state.compareMode === 'sentence') {
      const lang = side === 'source' ? article.source?.lang : article.target?.lang;
      return comparePairs(article).map((pair, index) => {
        const text = side === 'source' ? pair.source : pair.target;
        if (!text) return '';
        return `<div class="cmp-line cmp-sentence" data-block="${attr(pair.id)}" data-context="${attr(text)}">
          <span class="cmp-no">${String(index + 1).padStart(2, '0')}</span>
          <p class="cmp-text">${tokenizeHTML(text, lang)}</p>
        </div>`;
      }).join('');
    }
    const blocks = (article.target?.blocks || []);
    const lang = side === 'source' ? article.source?.lang : article.target?.lang;
    return blocks.map((block, index) => {
      const text = side === 'source' ? block.source : block.target;
      if (!text) return '';
      const type = block.type || 'paragraph';
      const context = attr(String(text).slice(0, 240));
      if (type === 'code') {
        return `<div class="cmp-line cmp-code" data-block="${attr(block.id || index)}"><span class="cmp-no">${String(index + 1).padStart(2, '0')}</span><pre>${esc(text)}</pre></div>`;
      }
      const tag = type === 'heading' ? 'h3' : type === 'quote' ? 'blockquote' : 'p';
      return `<div class="cmp-line cmp-${attr(type)}" data-block="${attr(block.id || index)}" data-context="${context}">
        <span class="cmp-no">${String(index + 1).padStart(2, '0')}</span>
        <${tag} class="cmp-text">${tokenizeHTML(text, lang)}</${tag}>
      </div>`;
    }).join('');
  }

  function compareGrammarHTML(article) {
    const points = article.grammar?.points || [];
    if (!points.length) return `<div class="cmp-side-empty"><span class="glyph-sm">法</span><p>这篇文章没有识别到明显的语法点。</p><a class="btn btn-sm btn-ghost" href="/grammar" data-link>去语法索引 ${icon('arrow', 12)}</a></div>`;
    return `<div class="cmp-grammar-list">${points.map((point) => `
      <a class="cmp-grammar-card" href="/grammar/${encodeURIComponent(point.id)}?from=${encodeURIComponent(article.id)}" data-link>
        <div class="cg-top"><span class="cg-cat">${esc(point.category || '语法')}</span><span class="cg-count">${point.count || 1} 处</span></div>
        <h4>${esc(point.title)}<small>${esc(point.english || '')}</small></h4>
        <p>${esc(point.summary || '')}</p>
        <span class="cg-link">查看完整讲解 ${icon('arrow', 12)}</span>
      </a>`).join('')}</div>`;
  }

  function compareWordsHTML() {
    if (!state.wordHistory.length) {
      return `<div class="cmp-side-empty"><span class="glyph-sm">词</span><p>在左边原文或右边译文里点一个词，这里会记住你查过的词。</p></div>`;
    }
    return `<div class="cmp-word-list">${state.wordHistory.map((item, index) => `
      <button type="button" class="cmp-word-card" data-action="reopen-word" data-index="${index}">
        <span class="cw-word">${esc(item.word)}</span>
        ${item.phonetic ? `<span class="cw-phon">/${esc(item.phonetic)}/</span>` : ''}
        <span class="cw-pos">${esc((item.pos || []).slice(0, 2).join(' · '))}</span>
        <span class="cw-first">${esc(item.meanings?.[0]?.text || '')}</span>
      </button>`).join('')}</div>`;
  }

  function compareRightHTML(article) {
    if (state.compareView === 'grammar') return compareGrammarHTML(article);
    if (state.compareView === 'words') return compareWordsHTML();
    return compareStreamHTML(article, 'target');
  }

  function renderCompare(article) {
    const root = $('#compare-root');
    if (!root) return;
    const stats = article.source?.stats || {};
    const points = article.grammar?.points?.length || article.grammar?.summary?.total || 0;
    root.innerHTML = `
      <div class="compare-head">
        <div class="compare-title-row">
          <div>
            <h1>${esc(article.title || '未命名文章')}</h1>
            <p>${esc(article.source?.label || article.source?.lang || '原文')} <span class="arr">→</span> ${esc(article.target?.label || article.target?.lang || '译文')} ｜ ${fmtNumber(stats.paragraphs || 0)} 段 ｜ ${fmtNumber(points)} 个语法点</p>
          </div>
          <div class="compare-actions">
            <div class="compare-modes">
              <button data-action="compare-mode" data-mode="block" class="${state.compareMode === 'block' ? 'is-active' : ''}">逐段</button>
              <button data-action="compare-mode" data-mode="sentence" class="${state.compareMode === 'sentence' ? 'is-active' : ''}">逐句</button>
            </div>
            <a class="btn btn-sm btn-ghost" href="/" data-link>${icon('arrowLeft', 13)} 回翻译台</a>
            <button class="btn btn-sm btn-ghost" data-action="download-word">${icon('file', 13)} Word</button>
            <button class="btn btn-sm btn-ghost" data-action="copy-link">${icon('link', 13)} 复制链接</button>
          </div>
        </div>

      </div>
      <div class="compare-columns">
        <section class="cmp-col cmp-left" aria-label="原文">
          <div class="cmp-col-head"><span>原文</span><span class="cmp-lang">${esc((article.source?.label || article.source?.lang || '').toUpperCase())}</span></div>
          <div class="cmp-stream" id="cmp-left-stream">${compareStreamHTML(article, 'source')}</div>
        </section>
        <section class="cmp-col cmp-right" aria-label="译文和辅助内容">
          <div class="cmp-col-head">
            <span>译文</span>
            <div class="cmp-tabs" role="tablist">
              <button data-action="compare-tab" data-view="translation" class="${state.compareView === 'translation' ? 'is-active' : ''}">译文</button>
              <button data-action="compare-tab" data-view="grammar" class="${state.compareView === 'grammar' ? 'is-active' : ''}">语法 <b>${points}</b></button>
              <button data-action="compare-tab" data-view="words" class="${state.compareView === 'words' ? 'is-active' : ''}">查词</button>
            </div>
          </div>
          <div class="cmp-stream" id="cmp-right">${compareRightHTML(article)}</div>
        </section>
      </div>`;
  }

  function switchCompareMode(mode) {
    state.compareMode = mode === 'sentence' ? 'sentence' : 'block';
    $$('[data-action="compare-mode"]').forEach((button) => button.classList.toggle('is-active', button.dataset.mode === state.compareMode));
    const left = $('#cmp-left-stream');
    const right = $('#cmp-right');
    if (left) left.innerHTML = compareStreamHTML(state.article, 'source');
    if (right && state.compareView === 'translation') right.innerHTML = compareStreamHTML(state.article, 'target');
    toast(state.compareMode === 'sentence' ? '已切换为逐句对照' : '已切换为逐段对照', 'success');
  }

  function switchCompareView(view) {
    state.compareView = ['translation', 'grammar', 'words'].includes(view) ? view : 'translation';
    $$('[data-action="compare-tab"]').forEach((button) => button.classList.toggle('is-active', button.dataset.view === state.compareView));
    const right = $('#cmp-right');
    if (right) right.innerHTML = compareRightHTML(state.article);

  // ---------------------------------------------------------------- word card
  function ensureWordCard() {
    if ($('#word-card')) return;
    const card = document.createElement('div');

    card.className = 'word-card';
    card.hidden = true;

  function wordCardLoading(word) {
    return `<div class="wc-head"><div><span class="wc-word">${esc(word)}</span><span class="wc-phon">查询中…</span></div><button class="wc-close" data-action="close-word" aria-label="关闭">${icon('x', 14)}</button></div>
      <div class="wc-loading"><span class="spinner"></span><span>正在查词典…</span></div>`;

  function wordCardHTML(data) {
    const meanings = (data.meanings || []).map((meaning, index) => `
      <li><span class="wc-index">${index + 1}</span><span class="wc-pos">${esc(meaning.pos || '释义')}</span><span class="wc-mean">${esc(meaning.text || '')}</span></li>`).join('');
    const morph = data.morphology;
    const saved = state.notebookKeys.has(notebookKey(data.lang, data.word));
    const firstMeaning = data.meanings?.[0]?.text || '';
    const saveHTML = `<button class="wc-save" data-action="toggle-notebook" data-word="${attr(data.word)}" data-lang="${attr(data.lang || 'en')}" data-reading="${attr(data.phonetic || '')}" data-pos="${attr((data.pos || [])[0] || '')}" data-meaning="${attr(firstMeaning)}" data-context="${attr(data.context || '')}">${saved ? '✓ 已在生词本' : '+ 加入生词本'}</button>`;
    const morphHTML = morph?.available ? `<div class="wc-morph">
      <div class="wc-morph-head"><span>在本文中的状态</span><b>${esc(morph.form || '文中形式')}</b></div>
      <div class="wc-form-pair">
        <div><small>${esc(morph.before?.label || '词典形')}</small><strong>${esc(morph.before?.text || '')}</strong></div>
        <span class="wc-arrow">${icon('arrow', 13)}</span>
        <div><small>${esc(morph.after?.label || '文中形式')}</small><strong>${esc(morph.after?.text || data.word)}</strong></div>
      </div>
      ${morph.change ? `<div class="wc-change">${esc(morph.change)}</div>` : ''}
      ${morph.features?.length ? `<div class="wc-form-tags">${morph.features.map((tag) => `<span>${esc(tag)}</span>`).join('')}</div>` : ''}
      <p class="wc-morph-explain">${esc(morph.explain || '')}</p>
    </div>` : '';
    return `<div class="wc-head">
      <div class="wc-title"><span class="wc-word">${esc(data.word)}</span>${data.phonetic ? `<span class="wc-phon">/${esc(data.phonetic)}/</span>` : ''}</div>
      <button class="wc-close" data-action="close-word" aria-label="关闭">${icon('x', 14)}</button>
    </div>
    <div class="wc-pos-row">${(data.pos || []).map((pos) => `<span class="wc-chip">${esc(pos)}</span>`).join('')}</div>
    <ol class="wc-meanings">${meanings}</ol>
    ${saveHTML}
    ${morphHTML}
    ${data.context ? `<div class="wc-context"><span>原句</span><p>${esc(data.context)}</p></div>` : ''}
    <div class="wc-foot"><span class="wc-source">释义来自 ${esc(data.source || '词典')}</span><div class="wc-actions"><button class="wc-icon" data-action="speak-word" title="朗读">${icon('speaker', 14)}</button><button class="wc-icon" data-action="copy-word" title="复制">${icon('copy', 14)}</button></div></div>`;
  }

  function positionWordCard(token) {
    const card = $('#word-card');
    if (!card || card.hidden) return;
    const rect = token.getBoundingClientRect();
    const width = card.offsetWidth || 320;
    const height = card.offsetHeight || 220;
    const gap = 10;
    const below = rect.bottom + gap;
    const above = rect.top - height - gap;
    const useAbove = below + height > window.innerHeight - 12 && above > 8;
    const top = Math.max(72, useAbove ? above : below);
    const left = Math.min(window.innerWidth - width - 12, Math.max(12, rect.left + rect.width / 2 - width / 2));
    card.classList.toggle('is-above', useAbove);
    card.style.left = `${left}px`;
    card.style.top = `${top}px`;
    card.style.setProperty('--arrow-x', `${Math.min(width - 26, Math.max(26, rect.left + rect.width / 2 - left))}px`);
  }

  function closeWordCard() {
    const card = $('#word-card');
    if (card) card.hidden = true;
    state.activeWordToken?.classList.remove('is-active');
    state.activeWordToken = null;
  }

  function showWordFromData(data, anchor) {
    ensureWordCard();
    const card = $('#word-card');
    if (!card) return;
    closeWordCard();
    card.dataset.word = data.word;
    card.dataset.lang = data.lang;
    card.innerHTML = wordCardHTML(data);
    card.hidden = false;
    positionWordCard(anchor);
  }

  async function openWordCard(token) {
    ensureWordCard();
    const card = $('#word-card');
    const word = token.dataset.word || token.textContent || '';
    const lang = token.dataset.lang || 'en';
    const context = token.dataset.context || token.closest('.cmp-line')?.dataset.context || '';
    if (!word || !card) return;
    closeWordCard();
    state.activeWordToken = token;
    token.classList.add('is-active');
    card.dataset.word = word;
    card.dataset.lang = lang;
    card.hidden = false;
    card.innerHTML = wordCardLoading(word);
    positionWordCard(token);
    const key = `${lang}:${word.toLowerCase()}`;
    try {
      let data = state.wordCache.get(key);
      if (!data) {
        data = await api(`/api/word?q=${encodeURIComponent(word)}&lang=${encodeURIComponent(lang)}&context=${encodeURIComponent(context)}`);
        if (!data.ok) throw new Error(data.error || '没有找到释义');
        state.wordCache.set(key, data);
      }
      if (!card.hidden) {
        card.innerHTML = wordCardHTML(data);
        state.wordHistory = [data, ...state.wordHistory.filter((item) => !(item.word === data.word && item.lang === data.lang))].slice(0, 12);
        requestAnimationFrame(() => positionWordCard(token));
        if (state.compareView === 'words' && $('#cmp-right')) $('#cmp-right').innerHTML = compareWordsHTML();
      }
    } catch (err) {
      if (!card.hidden) {
        card.innerHTML = `<div class="wc-head"><div><span class="wc-word">${esc(word)}</span></div><button class="wc-close" data-action="close-word" aria-label="关闭">${icon('x', 14)}</button></div><div class="wc-error">${esc(err.message || '查询失败')}<br><span>可以试试更短的词，或检查网络。</span></div>`;
        requestAnimationFrame(() => positionWordCard(token));
      }
    }
  }

  function speakWord() {
    const card = $('#word-card');
    const word = card?.dataset.word;
    if (!word || !('speechSynthesis' in window)) { toast('当前浏览器不支持朗读。', 'error'); return; }
    const utterance = new SpeechSynthesisUtterance(word);
    utterance.lang = card?.dataset.lang === 'zh' ? 'zh-CN' : card?.dataset.lang === 'ja' ? 'ja-JP' : card?.dataset.lang === 'fr' ? 'fr-FR' : 'en-US';
    speechSynthesis.cancel();
    speechSynthesis.speak(utterance);
  }

  // ---------------------------------------------------------------- article breakdown
  function analyzeHTML() {
    return `<section class="analyze-page">
      <div class="compare-breadcrumb"><a href="/" data-link>翻译台</a><span>/</span><span>文章拆解</span></div>
      <div id="analyze-root"><div class="compare-loading"><span class="spinner"></span><span>正在逐句拆解文章…</span></div></div>
    </section>`;

  async function afterAnalyze() {
    const root = $('#analyze-root');
    if (!root) return;
    const params = new URLSearchParams(location.search);
    const id = params.get('id') || state.article?.id;
    try {
      const data = await api(`/api/analyze${id ? `?id=${encodeURIComponent(id)}` : ''}`);
      if (!state.article || (id && state.article.id !== id)) {
        try {
          const article = await api(`/api/history/${encodeURIComponent(id || state.article?.id)}`);
          state.article = article.article;
        } catch { /* analysis still renders without the article object */ }
      }
      renderAnalysis(data.analysis, state.article);
    } catch (err) {
      root.innerHTML = `<div class="empty-page"><div class="glyph">拆</div><h2>这篇文章还拆不开</h2><p>${esc(err.message)}</p><a class="btn btn-primary" href="/" data-link>先去翻译一篇 ${icon('arrow', 13)}</a></div>`;
    }

  function analysisTokenHTML(token, lang, context) {
    const word = token.text || '';
    if (!word || token.pos === '标点' || !/[\p{L}\p{N}]/u.test(word)) {
      return `<span class="ana-punc">${esc(word)}</span>`;
    }
    return `<button type="button" class="ana-token word-token" data-word="${attr(word)}" data-lang="${attr(lang)}" data-context="${attr(context)}"><span class="ana-token-word">${esc(word)}</span><span class="ana-token-pos">${esc(token.pos || '词')}</span></button>`;
  }

  function renderAnalysis(analysis, article) {
    const root = $('#analyze-root');
    if (!root) return;
    const summary = analysis.summary || {};
    const title = analysis.title || article?.title || '文章拆解';
    const displayTitle = title.length > 52 ? `${title.slice(0, 52)}…` : title;
    const articleId = analysis.articleId || article?.id || '';
    const features = analysis.features || [];
    root.innerHTML = `
      <div class="analyze-head">
        <div>
          <h1>${esc(displayTitle)}</h1>
          <p>${esc(analysis.languageLabel)} · ${summary.sentences || 0} 句 · ${summary.tokens || 0} 词 · ${summary.featureTypes || 0} 类语法现象</p>
        </div>
        <div class="compare-actions">
          <a class="btn btn-sm btn-ghost" href="/compare${article?.id ? `?id=${encodeURIComponent(article.id)}` : ''}" data-link>${icon('columns', 13)} 对照阅读</a>
          <a class="btn btn-sm btn-ghost" href="/" data-link>${icon('arrowLeft', 13)} 回翻译台</a>
        </div>
      </div>
      <div class="analyze-note">${icon('spark', 13)} 先按句切开，再拆主干、短语和语法点。标点是规则拆解，适合当阅读索引；需要更深的语义分析可在设置里配置 AI Key。${analysis.note ? `<br>${esc(analysis.note)}` : ''}</div>
      <div class="analyze-summary">
        <div class="ana-stat"><strong>${summary.sentences || 0}</strong><span>句子</span></div>
        <div class="ana-stat"><strong>${summary.tokens || 0}</strong><span>词/标点</span></div>
        <div class="ana-stat"><strong>${summary.featureTypes || 0}</strong><span>语法类别</span></div>
        <div class="ana-stat"><strong>${summary.catalogSize || 0}</strong><span>扫描器覆盖</span></div>
      </div>
      ${features.length ? `<div class="analyze-feature-strip">${features.map((f) => `
        <button type="button" class="ana-feature-summary" ${f.detail ? `data-goto="/grammar/${encodeURIComponent(f.detail)}?from=${encodeURIComponent(articleId)}"` : ''} title="${attr(f.summary || '')}">
          <span>${esc(f.title)}</span><b>${f.count}</b><small>${esc(f.category || '')}</small>
        </button>`).join('')}</div>` : ''}
      <div class="analyze-sentences">${(analysis.sentences || []).map((sentence, index) => {
        const sk = sentence.skeleton || {};
        return `<article class="ana-sentence" id="${attr(sentence.id)}">
          <div class="ana-sentence-head"><span class="ana-no">${String(index + 1).padStart(2, '0')}</span><span class="ana-lang">${esc(analysis.languageLabel)}</span><button class="icon-btn" data-action="speak-sentence" data-text="${attr(sentence.text)}" title="朗读原句" aria-label="朗读原句">${icon('speaker', 14)}</button></div>
          <p class="ana-source">${esc(sentence.text)}</p>
          ${sentence.translation ? `<p class="ana-translation">${esc(sentence.translation)}</p>` : ''}
          <div class="ana-skeleton">${sk.topic ? `<span class="ana-role"><b>话题</b>${esc(sk.topic)}</span>` : ''}${sk.subject ? `<span class="ana-role"><b>主语</b>${esc(sk.subject)}</span>` : ''}${sk.predicate ? `<span class="ana-role"><b>谓语</b>${esc(sk.predicate)}</span>` : ''}${sk.object ? `<span class="ana-role"><b>宾语</b>${esc(sk.object)}</span>` : ''}${sk.adverbial ? `<span class="ana-role"><b>状语</b>${esc(sk.adverbial)}</span>` : ''}</div>
          <div class="ana-tokens">${(sentence.tokens || []).map((token) => analysisTokenHTML(token, analysis.language, sentence.text)).join('')}</div>
          <div class="ana-chunks">${(sentence.chunks || []).map((chunk) => `<span class="ana-chunk ${chunk.role === '主语' ? 'is-subject' : chunk.role === '谓语' ? 'is-predicate' : chunk.role === '宾语' ? 'is-object' : ''}"><b>${esc(chunk.role || chunk.label)}</b>${esc(chunk.text)}</span>`).join('')}</div>
          ${sentence.features?.length ? `<div class="ana-features">${sentence.features.map((feature) => feature.detail ? `<a class="ana-feature" href="/grammar/${encodeURIComponent(feature.detail)}?from=${encodeURIComponent(articleId)}" data-link title="${attr(feature.summary || '')}">${esc(feature.title)} ${icon('arrow', 10)}</a>` : `<span class="ana-feature" title="${attr(feature.summary || '')}">${esc(feature.title)}</span>`).join('')}</div>` : ''}
        </article>`;
      }).join('') || `<div class="empty-page"><div class="glyph">句</div><h2>没有可拆解的句子</h2><p>这篇文章的正文可能是代码或空内容。</p></div>`}</div>`;
  }

  function speakSentence(text) {
    if (!('speechSynthesis' in window)) { toast('当前浏览器不支持朗读。', 'error'); return; }
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = state.article?.source?.lang === 'zh-CN' || state.article?.source?.lang === 'zh-TW' ? 'zh-CN' : state.article?.source?.lang === 'ja' ? 'ja-JP' : 'en-US';
    speechSynthesis.cancel();
    speechSynthesis.speak(utterance);
  }

  // ---------------------------------------------------------------- library station
  function libraryHTML() {
    return `<section class="library-page">
      <div class="compare-breadcrumb"><a href="/" data-link>翻译台</a><span>/</span><span>学习站台</span></div>
      <div id="library-root"><div class="compare-loading"><span class="spinner"></span><span>正在整理语法与词汇…</span></div></div>
    </section>`;

  async function afterLibrary() {
    const root = $('#library-root');
    if (!root) return;
    try {
      const stats = await api('/api/library/stats');
      state.libraryStats = stats;
      renderLibraryShell(stats);
      await loadLibrary(true);
      const search = $('#lib-search');
      search?.addEventListener('input', debounce(() => {
        state.libraryQuery = search.value.trim();
        state.libraryPage = 1;
        loadLibrary(true);
      }, 220));
    } catch (err) {
      root.innerHTML = `<div class="empty-page"><div class="glyph">册</div><h2>词库没有加载出来</h2><p>${esc(err.message)}</p></div>`;
    }
  }

  function libraryLanguageStats(code) {
    return (state.libraryStats?.languages || []).find((item) => item.code === code) || { levels: [], words: 0, grammar: 0 };
  }

  function renderLibraryShell(stats) {
    const root = $('#library-root');
    if (!root) return;
    const langs = stats.languages || [];
    const current = libraryLanguageStats(state.libraryLang);
    root.innerHTML = `
      <div class="library-head">
        <div>
          <p class="eyebrow">GRAMMAR & VOCABULARY</p>
          <h1>语法与词汇<br><em>放在同一张桌上。</em></h1>
          <p>${fmtNumber(stats.words || 0)} 个词条 · ${fmtNumber(stats.grammar || 0)} 条语法 · 按语言和等级筛选</p>
        </div>
        <div class="library-big-numbers"><strong>${fmtNumber(stats.words || 0)}</strong><span>WORDS</span><i></i><strong>${fmtNumber(stats.grammar || 0)}</strong><span>GRAMMAR</span></div>
      </div>
      <div class="library-tabs">
        <button data-action="lib-tab" data-tab="words" class="${state.libraryTab === 'words' ? 'is-active' : ''}">${icon('book', 14)} 单词册</button>
        <button data-action="lib-tab" data-tab="grammar" class="${state.libraryTab === 'grammar' ? 'is-active' : ''}">${icon('layers', 14)} 语法库</button>
        <button data-action="lib-tab" data-tab="notebook" class="${state.libraryTab === 'notebook' ? 'is-active' : ''}">${icon('bookmark', 14)} 生词本 <b>${state.notebookItems?.length || 0}</b></button>
        <span class="library-tip">${state.libraryTab === 'words' ? '按等级背词，支持中文/英文释义' : state.libraryTab === 'grammar' ? '日文 N5–N1 565 条，中文/英文释义' : '查词时点「加入生词本」，这里集中复习'}</span>
      </div>
      <div class="library-langs">${langs.map((item) => `
        <button class="lib-lang-card ${state.libraryLang === item.code ? 'is-active' : ''}" data-action="lib-lang" data-lang="${attr(item.code)}">
          <span class="lib-lang-dot"></span><strong>${esc(item.label)}</strong>
          <small>${fmtNumber(item.words)} 词 · ${fmtNumber(item.grammar)} 语法</small>
        </button>`).join('')}</div>
      <div class="library-toolbar">
        <div class="lib-levels" id="lib-levels"></div>
        <div class="search-box lib-search-box">${icon('search', 15)}<input id="lib-search" type="search" placeholder="${state.libraryTab === 'words' ? '搜单词、读音、释义…' : '搜语法句型、释义…'}" value="${attr(state.libraryQuery)}" autocomplete="off" /></div>
      </div>
      <div class="library-meta"><span id="lib-count"></span><span id="lib-current"></span></div>
      <div class="library-grid" id="lib-grid"></div>
      <div class="library-more-wrap"><button class="btn btn-sm btn-primary" id="lib-start-review" data-action="start-review" ${state.libraryTab === 'notebook' ? '' : 'hidden'}>${icon('book', 13)} 开始背词</button><button class="btn btn-sm" id="lib-more" data-action="lib-more" hidden>加载更多</button></div>`;
    renderLibraryLevels();
  }

  function renderLibraryLevels() {
    const box = $('#lib-levels');
    if (!box) return;
    if (state.libraryTab === 'notebook') { box.innerHTML = ''; return; }
    const current = libraryLanguageStats(state.libraryLang);
    const levels = current.levels || [];
    box.innerHTML = `<button class="lib-level ${state.libraryLevel === '' ? 'is-active' : ''}" data-action="lib-level" data-level="">全部</button>` +
      levels.map((level) => `<button class="lib-level ${state.libraryLevel === level ? 'is-active' : ''}" data-action="lib-level" data-level="${attr(level)}">${esc(level)}</button>`).join('');
  }

  async function loadLibrary(reset = false) {
    const grid = $('#lib-grid');
    if (!grid) return;
    if (state.libraryTab === 'notebook') {
      await loadNotebook();
      const q = state.libraryQuery.toLowerCase();
      const items = state.notebookItems.filter((item) => {
        if (q && !`${item.word} ${item.reading} ${item.meaning}`.toLowerCase().includes(q)) return false;
        return true;
      });
      grid.innerHTML = items.length ? items.map(libraryNotebookCard).join('') : `<div class="empty-page" style="grid-column:1/-1"><div class="glyph">词</div><h2>生词本还是空的</h2><p>查词时点「加入生词本」，这里会收起来。</p></div>`;
      const count = $('#lib-count');
      if (count) count.textContent = `已收藏 ${items.length} 个词`;
      const current = $('#lib-current');
      if (current) current.textContent = state.notebookItems.length ? '点「开始背词」进入复习' : '';
      const more = $('#lib-more');
      if (more) more.hidden = true;
      return;
    }
    if (reset) {
      state.libraryPage = 1;
      grid.innerHTML = Array.from({ length: 6 }).map(() => `<div class="lib-skeleton"><div></div><div></div><div></div></div>`).join('');
    }
    const tab = state.libraryTab === 'grammar' ? 'grammar' : 'words';
    const params = new URLSearchParams({ lang: state.libraryLang, page: String(state.libraryPage), size: tab === 'words' ? '48' : '36' });
    if (state.libraryLevel) params.set('level', state.libraryLevel);
    if (state.libraryQuery) params.set('q', state.libraryQuery);
    try {
      const data = await api(`/api/library/${tab}?${params.toString()}`);
      state.libraryData = data;
      const items = data.items || [];
      const cards = items.map((item) => tab === 'grammar' ? libraryGrammarCard(item) : libraryWordCard(item)).join('');
      if (reset) grid.innerHTML = cards || `<div class="empty-page" style="grid-column:1/-1"><div class="glyph">空</div><h2>没有匹配的词条</h2><p>换一个等级或关键词试试。</p></div>`;
      else grid.insertAdjacentHTML('beforeend', cards);
      const count = $('#lib-count');
      if (count) count.textContent = `找到 ${fmtNumber(data.total || 0)} 条`;
      const current = $('#lib-current');
      if (current) current.textContent = `第 ${data.page || 1} / ${data.pages || 1} 页`;
      const more = $('#lib-more');
      if (more) more.hidden = (data.page || 1) >= (data.pages || 1);
    } catch (err) {
      if (reset) grid.innerHTML = `<div class="empty-page" style="grid-column:1/-1"><div class="glyph">!</div><h2>加载失败</h2><p>${esc(err.message)}</p></div>`;
    }
  }

  function libraryWordCard(item) {
    const meaning = item.meaning_zh || item.meaning_en || '';
    return `<article class="lib-word-card">
      <div class="lib-card-top"><span class="lib-level">${esc(item.level)}</span><span class="lib-pos">${esc((item.pos || '').replaceAll('；', ' · '))}</span></div>
      <h3>${esc(item.word)}${item.reading ? `<small>${esc(item.reading)}</small>` : ''}</h3>
      <p class="lib-meaning">${esc(meaning)}</p>
      ${item.meaning_en && item.meaning_zh ? `<p class="lib-meaning-en">${esc(item.meaning_en)}</p>` : ''}
